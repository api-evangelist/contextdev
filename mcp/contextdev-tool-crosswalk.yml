assessment: >-
  Two tools cover a 49-operation API. That is a real, live, anonymous-discoverable
  agent surface and it is genuinely more capable than a thin tool list — an agent
  can compose several calls in one round trip. The trade-off worth recording: no
  operation-level inputSchema reaches the client, so the protocol cannot validate
  arguments and the model must get the SDK types right on its own. Agents that
  select tools by schema matching will see two generic tools rather than 49
  typed ones.
