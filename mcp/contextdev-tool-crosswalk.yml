provenance_caveat: >-
  Context.dev runs TWO hosted MCP endpoints. The canonical one the docs now name,
  https://mcp.context.dev/mcp, gates discovery behind OAuth (401 + RFC 9728
  challenge), so its tool list could not be read anonymously. Every tool
  definition in this crosswalk was read live from the legacy Stainless endpoint
  https://context-dev.stlmcp.com, which still answers tools/list without auth.
  Both serve the same product and the docs describe the same Code-Mode design, but
  the canonical server's tool list has NOT been independently verified and could
  differ. Confirming it requires an authenticated OAuth introspection pass.
note: >-
  Context.dev's hosted MCP server is a CODE-MODE server, not an operation-per-tool
  server. Stainless generates exactly two meta-tools over the whole TypeScript SDK
  rather than one tool per REST operation, so this crosswalk is deliberately NOT a
  1:1 table. `execute` binds to the ENTIRE OpenAPI surface indirectly — it runs
  agent-authored TypeScript against an initialized SDK client inside a sandbox —
  and `search_docs` binds to no REST operation at all. Recording a per-operation
  crosswalk here would fabricate a tool surface the provider does not expose.
