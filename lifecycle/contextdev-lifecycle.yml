    note: >-
      Webhook secret rotation. Documented at
      https://docs.context.dev/api-reference/monitors/rotate-webhook-secret.md but
      absent from the refined monitors spec in this repo.
  - surface: Brand Intelligence
    operations:
    - GET /brand/search
    note: Present in the current docs; absent from the July harvest.
  superseded:
  - from: POST /people/retrieve
    to: POST /people/enrich
    announced: '2026-08-06'
    announcement: https://docs.context.dev/changelog ("People Enrichment API", August 6th)
    breaking: unclear
    note: >-
      The changelog announces POST /people/enrich as a NEW endpoint — identity
