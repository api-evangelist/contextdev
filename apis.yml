- aid: contextdev:contextdev-batch-api
  name: Context.dev Batch API
  description: >-
    Submit up to 25,000 URLs or a whole-site crawl as a single asynchronous job and
    collect the results as paginated JSON or gzipped NDJSON. One batch submission
    counts as a single request against the per-minute rate limit however many pages
    it covers, and POST /batch/submit is the only Context.dev operation that accepts
    an Idempotency-Key header. 6 operation(s) for batch scraping and crawling.
  humanURL: https://docs.context.dev/api-reference/batches/submit
  baseURL: https://api.context.dev/v1
