aid: contextdev
name: Context.dev
description: >-
  Context.dev is the unified web-context API for software and AI agents — one API
  that turns any domain or URL into structured, typed JSON. It covers brand
  intelligence (logos, colors, fonts, socials, address, industry codes, stock
  ticker / ISIN and transaction-descriptor resolution), web scraping and crawling
  to clean Markdown or HTML, screenshots, sitemap discovery, web search, structured
  data extraction against a JSON Schema, product extraction, document parsing to
  Markdown, NAICS / SIC classification, and website change monitoring with signed
  webhooks. Typed first-party SDKs ship for TypeScript, Python, Ruby, Go, and PHP,
  alongside a CLI, a hosted MCP server, and a published Agent Skill. Founded in
  2025 by Yahia Bakour and backed by Y Combinator (S26).
