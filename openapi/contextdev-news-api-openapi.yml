openapi: 3.2.0
info:
  title: Context.dev News API
  description: Scrape, crawl, search, and monitor websites, and retrieve brand, people, and news data.
  version: 1.0.0
servers:
- url: https://api.context.dev/v1
tags:
- name: News
  description: Search live and historical news about a company.
paths:
  /news/search:
    post:
      summary: Search news
      description: Find news about a company by name, domain, ticker, or ISIN, or search all news with a natural-language query. Filter articles and continue through results with a cursor.
      tags:
      - News
      x-mint:
        content: <Badge color="blue">1 credit per 10 results</Badge>
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                searchBy:
                  oneOf:
                  - $ref: '#/components/schemas/NewsSearchByNaturalLanguage'
                  - $ref: '#/components/schemas/NewsSearchByEntity'
                  discriminator:
                    propertyName: type
                    mapping:
                      natural_language: '#/components/schemas/NewsSearchByNaturalLanguage'
                      entity: '#/components/schemas/NewsSearchByEntity'
                  description: 'What to search for: a specific company, or a natural-language query across all news.'
                filterBy:
                  type: object
                  properties:
                    sourceDomain:
                      type: array
                      items:
                        type: string
                        minLength: 1
                        maxLength: 253
                      minItems: 1
                      maxItems: 3
                      description: Publisher domains to include. Up to 3.
                    sourceCountry:
                      type: array
                      items:
                        type: string
                        enum:
                        - ae
                        - ar
                        - au
                        - ca
                        - cg
                        - ch
                        - cl
                        - cz
                        - de
                        - fi
                        - fr
                        - gb
                        - hk
                        - il
                        - in
                        - jp
                        - kr
                        - mx
                        - ng
                        - nl
                        - pk
                        - qa
                        - sa
                        - se
                        - sg
                        - us
                        - za
                      minItems: 1
                      maxItems: 3
                      description: Publisher countries to include, as lowercase ISO 3166-1 alpha-2 codes. Up to 3.
                    articleLanguage:
                      type: array
                      items:
                        type: string
                        enum:
                        - am
                        - ar
                        - az
                        - be
                        - bg
                        - bn
                        - ca
                        - ceb
                        - cs
                        - cy
                        - da
                        - de
                        - el
                        - en
                        - es
                        - et
                        - eu
                        - fa
                        - fi
                        - fr
                        - gu
                        - ha
                        - haw
                        - he
                        - hi
                        - hr
                        - hu
                        - hy
                        - id
                        - is
                        - it
                        - ja
                        - ka
                        - kk
                        - kn
                        - ko
                        - ku
                        - ky
                        - lo
                        - lt
                        - lv
                        - mk
                        - ml
                        - mn
                        - mr
                        - ms
                        - ne
                        - nl
                        - 'no'
                        - or
                        - pa
                        - pl
                        - ps
                        - pt
                        - ro
                        - ru
                        - sk
                        - sl
                        - so
                        - sq
                        - sr
                        - sv
                        - sw
                        - ta
                        - te
                        - th
                        - tl
                        - tr
                        - uk
                        - ur
                        - uz
                        - vi
                        - yo
                        - zh
                      minItems: 1
                      maxItems: 3
                      description: Article languages to include. Up to 3.
                    articleType:
                      type: array
                      items:
                        type: string
                        enum:
                        - editorial
                        - press_release
                        - regulatory_filing
                        - advisory
                      minItems: 1
                      maxItems: 3
                      description: Article types to include. Up to 3.
                    date:
                      type: object
                      properties:
                        from:
                          type: integer
                          description: Inclusive start of the published-at window, in epoch milliseconds.
                        to:
                          type: integer
                          description: Inclusive end of the published-at window, in epoch milliseconds.
                      additionalProperties: false
                      description: Published-at window in epoch milliseconds. from must be before or equal to to.
                  additionalProperties: false
                  description: Optional result filters. Use at most one of sourceDomain, sourceCountry, articleLanguage, or articleType. A date range may accompany that category; date.from must not exceed date.to.
                  allOf:
                  - not:
                      required:
                      - sourceDomain
                      - sourceCountry
                  - not:
                      required:
                      - sourceDomain
                      - articleLanguage
                  - not:
                      required:
                      - sourceDomain
                      - articleType
                  - not:
                      required:
                      - sourceCountry
                      - articleLanguage
                  - not:
                      required:
                      - sourceCountry
                      - articleType
                  - not:
                      required:
                      - articleLanguage
                      - articleType
                sortBy:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - relevance
                      - newest
                      description: Result ordering.
                  required:
                  - type
                  additionalProperties: false
                  description: Result ordering. Defaults to newest for entity searches. Natural-language searches are always ordered by relevance.
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 10
                  description: Maximum results to return. Defaults to 10.
                cursor:
                  type:
                  - string
                  - 'null'
                  maxLength: 300
                  description: Opaque next_cursor from the previous response, or null for the first page.
                tags:
                  $ref: '#/components/schemas/RequestTags'
              required:
              - searchBy
              additionalProperties: false
            examples:
              entity:
                summary: Company news
                value:
                  searchBy:
                    type: entity
                    entity:
                      type: domain
                      domain: stripe.com
              natural_language:
                summary: Natural-language query
                value:
                  searchBy:
                    type: natural_language
                    query: chip export restrictions to China
      responses:
        '200':
          description: Company news results
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Stable unique identifier for this article. Use it to deduplicate or reference an article across requests.
                        story_id:
                          type: string
                          description: Shared by articles covering the same story on the same day. Use it to group or collapse syndicated copies of one announcement across outlets.
                        url:
                          type: string
                          format: uri
                          description: Link to the article on the publisher site.
                        title:
                          type: string
                          description: Article headline.
                        description:
                          type:
                          - string
                          - 'null'
                          description: Short summary or excerpt of the article, when the publisher provides one.
                        language:
                          type:
                          - string
                          - 'null'
                          description: Language the article is written in, as a lowercase ISO 639-1 code such as en. Null when unknown.
                        authors:
                          type: array
                          items:
                            type: string
                          description: Bylined authors. Empty when no byline is available.
                        image_url:
                          type:
                          - string
                          - 'null'
                          description: Lead image for the article, when one is available.
                        published_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: When the article was published, as an ISO 8601 timestamp. Null when the publisher does not state a reliable date.
                        type:
                          type: string
                          enum:
                          - editorial
                          - press_release
                          - regulatory_filing
                          - advisory
                          description: Kind of coverage. Use it to separate independent reporting (editorial) from company-issued content (press_release, regulatory_filing, advisory).
                        source:
                          type: object
                          properties:
                            name:
                              type: string
                              description: Name of the publication, such as Reuters.
                            domain:
                              type: string
                              description: Website domain of the publication.
                            direct:
                              type: boolean
                              description: True when Context observed this article in the publisher-owned feed.
                          required:
                          - name
                          - domain
                          - direct
                          description: The publication that published the article.
                        match:
                          type:
                          - object
                          - 'null'
                          properties:
                            level:
                              type: string
                              enum:
                              - primary
                              - secondary
                              description: primary when the article is mainly about the company, secondary when the company is mentioned but is not the main subject.
                            confidence:
                              type:
                              - number
                              - 'null'
                              minimum: 0
                              maximum: 1
                              description: How confident the match is, from 0 to 1. Null when a score is unavailable.
                          required:
                          - level
                          - confidence
                          description: How the article relates to the company you searched for. Null for natural-language searches.
                      required:
                      - id
                      - story_id
                      - url
                      - title
                      - description
                      - language
                      - authors
                      - image_url
                      - published_at
                      - type
                      - source
                      - match
                    description: Articles matching the search, in the requested order.
                  has_more:
                    type: boolean
                    description: True when more results are available beyond this page.
                  next_cursor:
                    type:
                    - string
                    - 'null'
                    description: Pass as cursor in the next request to fetch the following page. Null when there are no more results.
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                        minimum: 0
                        description: Number of articles in this page.
                    required:
                    - count
                    description: Summary information about this response.
                  key_metadata:
                    $ref: '#/components/schemas/KeyMetadata'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
                required:
                - data
                - has_more
                - next_cursor
                - meta
                - request_id
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: Insufficient credits (`USAGE_EXCEEDED`); authentication is valid. Retry once funded. Legacy deployments may return 401.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Request exceeded the applicable rate limit.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: News search failed because the index or an upstream resolver was unavailable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: postNewsSearch
      x-operation-id-source: derived
components:
  schemas:
    RequestTags:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 50
      maxItems: 20
      description: Labels for filtering usage in the dashboard.
      example:
      - production
      - team-alpha
    NewsSearchEntityByIsin:
      type: object
      properties:
        type:
          type: string
          enum:
          - isin
          description: Use `isin` to identify the company by its securities identifier.
        isin:
          type: string
          pattern: ^[A-Za-z]{2}[A-Za-z0-9]{9}[0-9]$
          description: International Securities Identification Number.
      required:
      - type
      - isin
      additionalProperties: false
      description: Identify the company by International Securities Identification Number.
      title: By ISIN
    NewsSearchByEntity:
      type: object
      properties:
        type:
          type: string
          enum:
          - entity
          description: Use `entity` to find news about a specific company.
        entity:
          oneOf:
          - $ref: '#/components/schemas/NewsSearchEntityByName'
          - $ref: '#/components/schemas/NewsSearchEntityByDomain'
          - $ref: '#/components/schemas/NewsSearchEntityByTicker'
          - $ref: '#/components/schemas/NewsSearchEntityByIsin'
          discriminator:
            propertyName: type
            mapping:
              name: '#/components/schemas/NewsSearchEntityByName'
              domain: '#/components/schemas/NewsSearchEntityByDomain'
              ticker: '#/components/schemas/NewsSearchEntityByTicker'
              isin: '#/components/schemas/NewsSearchEntityByIsin'
          description: The company to search news for, identified by name, domain, ticker, or ISIN.
      required:
      - type
      - entity
      additionalProperties: false
      description: Find news about a specific company.
      title: By Entity
    NewsSearchEntityByDomain:
      type: object
      properties:
        type:
          type: string
          enum:
          - domain
          description: Use `domain` to identify the company by website domain.
        domain:
          type: string
          minLength: 1
          maxLength: 253
          description: Company website domain, such as apple.com.
      required:
      - type
      - domain
      additionalProperties: false
      description: Identify the company by website domain.
      title: By Domain
    NewsSearchEntityByName:
      type: object
      properties:
        type:
          type: string
          enum:
          - name
          description: Use `name` to identify the company by name.
        name:
          type: string
          minLength: 2
          maxLength: 200
          description: Company name.
      required:
      - type
      - name
      additionalProperties: false
      description: Identify the company by name.
      title: By Name
    NewsSearchEntityByTicker:
      type: object
      properties:
        type:
          type: string
          enum:
          - ticker
          description: Use `ticker` to identify a publicly traded company.
        ticker:
          type: string
          minLength: 1
          maxLength: 20
          pattern: ^[A-Za-z0-9.-]+$
          description: Public-company ticker.
        exchange:
          type: string
          enum:
          - AMEX
          - AMS
          - AQS
          - ASX
          - ATH
          - BER
          - BME
          - BRU
          - BSE
          - BUD
          - BUE
          - BVC
          - CBOE
          - CNQ
          - CPH
          - DFM
          - DOH
          - DUB
          - DUS
          - DXE
          - EGX
          - FSX
          - HAM
          - HEL
          - HKSE
          - HOSE
          - ICE
          - IOB
          - IST
          - JKT
          - JNB
          - JPX
          - KLS
          - KOE
          - KSC
          - KUW
          - LIS
          - LSE
          - MCX
          - MEX
          - MIL
          - MUN
          - NASDAQ
          - NEO
          - NSE
          - NYSE
          - NZE
          - OSL
          - OTC
          - PAR
          - PNK
          - PRA
          - RIS
          - SAO
          - SAU
          - SES
          - SET
          - SGO
          - SHH
          - SHZ
          - SIX
          - STO
          - STU
          - TAI
          - TAL
          - TLV
          - TSX
          - TSXV
          - TWO
          - VIE
          - WSE
          - XETRA
          description: Stock exchange the ticker trades on, used to disambiguate tickers listed on multiple exchanges.
      required:
      - type
      - ticker
      additionalProperties: false
      description: Identify the company by stock ticker, optionally scoped to an exchange.
      title: By Ticker
    ConcurrencyErrorData:
      type: object
      properties:
        is_authenticated:
          type: boolean
          enum:
          - true
        limit_type:
          type: string
          enum:
          - concurrency
        limit:
          type: number
          minimum: 0
        remaining:
          type: number
          minimum: 0
        retry_after_seconds:
          type: number
          minimum: 0
        credits_remaining:
          type: number
          minimum: 0
        credits_charged:
          type: number
          enum:
          - 0
        should_retry:
          type: boolean
          enum:
          - false
        retry_condition:
          type: string
          enum:
          - available_concurrency
        recovery_options:
          type: array
          items:
            type: string
            enum:
            - wait_for_in_flight_requests
            - increase_concurrency_limit
        info_url:
          type: string
          enum:
          - https://context.dev/dashboard/subscription
      required:
      - is_authenticated
      - limit_type
      - limit
      - remaining
      - retry_after_seconds
      - credits_charged
      - should_retry
      - retry_condition
      - recovery_options
      - info_url
      description: Organization concurrency rejection details. Authentication is valid and no credits were charged. should_retry is false immediately; respect retry_after_seconds and wait for an in-flight request to finish or for the effective concurrency limit to increase. info_url opens subscription settings; no higher allowance is guaranteed for a particular account.
    KeyMetadata:
      type: object
      properties:
        credits_consumed:
          type: integer
          description: Credits charged for this request.
        credits_remaining:
          type: integer
          description: Credits remaining for your organization.
      required:
      - credits_consumed
      - credits_remaining
      description: Credits this request used and your remaining balance.
    BillingErrorData:
      type: object
      properties:
        is_authenticated:
          type: boolean
          enum:
          - true
        credits_remaining:
          type: number
          minimum: 0
        credits_required:
          type: number
          minimum: 0
        is_credits_required_estimated:
          type: boolean
        credits_charged:
          type: number
          minimum: 0
        should_retry:
          type: boolean
          enum:
          - false
        retry_condition:
          type: string
          enum:
          - sufficient_credits
        next_refill_at:
          type: string
          format: date-time
        next_refill_credits:
          type: number
          exclusiveMinimum: 0
        info_url:
          type: string
          enum:
          - https://context.dev/dashboard/subscription
      required:
      - is_authenticated
      - should_retry
      - retry_condition
      - info_url
      description: Credit admission or reservation failure details. credits_required is an admission estimate, not a final charge. should_retry is false for an unchanged request immediately; retry_condition requires sufficient account credits. Unknown balances, costs, and refill details are omitted. next_refill_at is an ISO 8601 UTC timestamp. Existing request_id and key_metadata remain on the error envelope.
    NewsSearchByNaturalLanguage:
      type: object
      properties:
        type:
          type: string
          enum:
          - natural_language
          description: Use `natural_language` to search all news with a plain-language query.
        query:
          type: string
          minLength: 2
          maxLength: 1000
          description: What to search for, in plain language, such as "chip export restrictions to China".
      required:
      - type
      - query
      additionalProperties: false
      description: Search all news with a plain-language query. Returns up to 100 matches, ordered by relevance.
      title: By Natural Language
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error message.
        error_code:
          type: string
          enum:
          - PROFILE_NOT_FOUND
          - PROFILE_BUSY
          - PROFILE_SESSION_EXPIRED
          - PROFILE_REAUTHENTICATION_REQUIRED
          - PROFILE_INVALID_CREDENTIALS
          - PROFILE_MISSING_CREDENTIALS
          - PROFILE_INTERACTION_REQUIRED
          - PROFILE_AUTHENTICATION_UNKNOWN
          - PROFILE_ORIGIN_BLOCKED
          - PROFILE_INVALID_SESSION
          - PROFILE_SESSION_TOO_LARGE
          - INTERNAL_ERROR
          - VALID
          - NOT_FOUND
          - FORBIDDEN
          - USAGE_EXCEEDED
          - RATE_LIMITED
          - UNAUTHORIZED
          - DISABLED
          - PAID_PLAN_REQUIRED
          - INSUFFICIENT_PERMISSIONS
          - TIMEOUT_EXCEEDS_MAXIMUM
          - TIMEOUT_TOO_SHORT_FOR_WAIT
          - WEBSITE_ACCESS_ERROR
          - WEBSITE_BLOCKED
          - WEBSITE_NOT_FOUND
          - PDF_SKIPPED
          - PDF_IMAGES_ONLY
          - INPUT_VALIDATION_ERROR
          - ZDR_NOT_SUPPORTED
          - ZDR_NOT_ENABLED
          - FREE_EMAIL_DETECTED
          - DISPOSABLE_EMAIL_DETECTED
          - REQUEST_TIMEOUT
          - COLD_DOMAIN_TIMEOUT_TOO_LOW
          - UNSUPPORTED_CONTENT
          - CONTENT_TOO_LARGE
          - MONITOR_PAUSED
          - MONITOR_NO_WEBHOOK
          - COLLECTION_PAUSED
          - MONITOR_LIMIT_EXCEEDED
          - SEARCH_UNAVAILABLE
          - BATCH_LIMIT_EXCEEDED
          - BATCH_NOT_CANCELLABLE
          - BATCH_NOT_COMPLETED
          - IDEMPOTENCY_KEY_CONFLICT
          - DELIVERY_IN_PROGRESS
          - DELIVERY_ALREADY_DELIVERED
          - DELIVERY_EXPIRED
          - DELIVERY_CANCELLED
          description: Machine-readable error code.
        error_data:
          anyOf:
          - $ref: '#/components/schemas/BillingErrorData'
          - $ref: '#/components/schemas/ConcurrencyErrorData'
        required_permission:
          type: string
          enum:
          - logs:read
          - data:execute
          - monitors:read
          - monitors:write
          - batches:read
          - batches:write
          description: Permission required for this request when error_code is INSUFFICIENT_PERMISSIONS. Manage (write) also grants read access to the same resource group.
        key_metadata:
          $ref: '#/components/schemas/KeyMetadata'
        request_id:
          $ref: '#/components/schemas/RequestId'
      required:
      - request_id
    RequestId:
      type: string
      format: uuid
      description: Unique ID of this request, also in `X-Request-Id`. Include it when contacting support.
      example: 3f1c2a6e-8b4d-4c1e-9f0a-2d7b5e6c8a91
  headers:
    RateLimitLimit:
      description: Maximum request units per minute, or maximum concurrent requests when X-RateLimit-Mode is concurrency.
      schema:
        type: integer
        minimum: 1
    RateLimitMode:
      description: Set to concurrency when these headers report concurrent requests. When a per-minute limit also applies, its rejections report per-minute headers without this header. New Free accounts have 2 concurrent requests and 10 requests per minute; paid plans have no per-minute limit by default. Existing and custom allowances can differ.
      schema:
        type: string
        enum:
        - concurrency
    RateLimitRemaining:
      description: Request units remaining in the current minute, or concurrent requests still available when X-RateLimit-Mode is concurrency.
      schema:
        type: integer
        minimum: 0
    RequestId:
      description: Unique ID of this request; also `request_id` in JSON bodies.
      schema:
        type: string
        format: uuid
    RateLimitReset:
      description: Unix timestamp in seconds when the per-minute rate limit resets. Omitted for concurrency limits.
      schema:
        type: integer
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        X-RateLimit-Mode:
          $ref: '#/components/headers/RateLimitMode'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        X-RateLimit-Mode:
          $ref: '#/components/headers/RateLimitMode'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        X-RateLimit-Mode:
          $ref: '#/components/headers/RateLimitMode'
