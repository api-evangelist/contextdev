    BrandResponse:
      type: object
      properties:
        partial:
          type: boolean
          description: True when the timeout ended processing and this response contains the usable data completed so far. Unfinished fields are omitted.
        status:
          type: string
          description: Always `ok` on success.
        brand:
          type: object
          properties:
            domain:
              type: string
              description: The domain name of the brand
            title:
              type: string
              description: The title or name of the brand
            description:
              type: string
              description: A brief description of the brand
            slogan:
              type: string
              description: The brand's slogan
            colors:
              type: array
              items:
                type: object
                properties:
                  hex:
                    type: string
                    description: Color in hexadecimal format
                  name:
                    type: string
                    description: Name of the color
                  source:
                    type: string
                    enum:
                    - site
                    - logo
                    description: 'Where the color was observed: ''site'' colors come from the website''s own theme signals (rendered page colors, manifest, theme-color meta), ''logo'' colors from logo image pixels.'
              description: An array of brand colors
            logos:
              type: array
              items:
                type: object
                properties:
                  url:
                    type: string
                    description: Hosted logo URL.
                  mode:
                    type: string
                    enum:
                    - light
                    - dark
                    - has_opaque_background
                    description: 'Indicates when this logo is best used: ''light'' = best for light mode, ''dark'' = best for dark mode, ''has_opaque_background'' = can be used for either as image has its own background'
                  colors:
                    type: array
                    items:
                      type: object
                      properties:
                        hex:
                          type: string
                          description: Color in hexadecimal format
                        name:
                          type: string
                          description: Name of the color
                    description: Array of colors in the logo
                  resolution:
                    type: object
                    properties:
                      width:
                        type: integer
                        description: Width of the image in pixels
                      height:
                        type: integer
                        description: Height of the image in pixels
                      aspect_ratio:
                        type: number
                        description: Aspect ratio of the image (width/height)
                    description: Resolution of the logo image
                  type:
                    type: string
                    enum:
                    - icon
                    - logo
                    description: Type of the logo based on resolution (e.g., 'icon', 'logo')
              description: An array of logos associated with the brand. When a similarly shaped SVG variant exists, it is returned ahead of its raster equivalent; otherwise relevance order is preserved
            backdrops:
              type: array
              items:
                type: object
                properties:
                  url:
                    type: string
                    description: URL of the backdrop image
                  colors:
                    type: array
                    items:
                      type: object
                      properties:
                        hex:
                          type: string
                          description: Color in hexadecimal format
                        name:
                          type: string
                          description: Name of the color
                    description: Array of colors in the backdrop image
                  resolution:
                    type: object
                    properties:
                      width:
                        type: integer
                        description: Width of the image in pixels
                      height:
                        type: integer
                        description: Height of the image in pixels
                      aspect_ratio:
                        type: number
                        description: Aspect ratio of the image (width/height)
                    description: Resolution of the backdrop image
              description: An array of backdrop images for the brand
            socials:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - x
                    - facebook
                    - instagram
                    - linkedin
                    - youtube
                    - pinterest
                    - tiktok
                    - dribbble
                    - github
                    - behance
                    - snapchat
                    - whatsapp
                    - telegram
                    - line
                    - discord
                    - twitch
                    - vimeo
                    - imdb
                    - tumblr
                    - flickr
                    - giphy
                    - medium
                    - spotify
                    - soundcloud
                    - tripadvisor
                    - yelp
                    - producthunt
                    - reddit
                    - crunchbase
                    - appstore
                    - playstore
                    description: Type of social media platform
                  url:
                    type: string
                    description: URL of the social media page
              description: An array of social media links for the brand
            address:
              type: object
              properties:
                street:
                  type: string
                  description: Street address
                city:
                  type: string
                  description: City name
                country:
                  type: string
                  description: Country name
                country_code:
                  type: string
                  description: Country code
                state_province:
                  type: string
                  description: State or province name
                state_code:
                  type: string
                  description: State or province code
                postal_code:
                  type: string
                  description: Postal or ZIP code
              description: Physical address of the brand
            stock:
              type: object
              properties:
                ticker:
                  type: string
                  description: Stock ticker symbol
                exchange:
                  type: string
                  description: Stock exchange name
              description: Stock market information for this brand (will be null if not a publicly traded company)
            employees:
              type: object
              properties:
                range:
                  type: string
                  enum:
                  - 1 to 10
                  - 11 to 50
                  - 51 to 200
                  - 201 to 500
                  - 501 to 1000
                  - 1001 to 5000
                  - 5001 to 10000
                  - 10001+
                  description: Employee count range for the brand (e.g. '11 to 50')
                exact:
                  type: integer
                  description: Exact employee count when a precise headcount is known
              description: Employee headcount information for the brand (will be null if unknown)
            is_nsfw:
              type: boolean
              description: Indicates whether the brand content is not safe for work (NSFW)
            email:
              type: string
              description: Company email address
            phone:
              type: string
              description: Company phone number
            industries:
              type: object
              properties:
                eic:
                  type: array
                  items:
                    type: object
                    properties:
                      industry:
                        $ref: '#/components/schemas/Industry'
                      subindustry:
                        $ref: '#/components/schemas/Subindustry'
                    required:
                    - industry
                    - subindustry
                  description: Easy Industry Classification - array of industry and subindustry pairs
              description: Industry classification information for the brand
            links:
              type: object
              properties:
                careers:
                  type:
                  - string
                  - 'null'
                  description: URL to the brand's careers or job opportunities page
                privacy:
                  type:
                  - string
                  - 'null'
                  description: URL to the brand's privacy policy page
                terms:
                  type:
                  - string
                  - 'null'
                  description: URL to the brand's terms of service or terms and conditions page
                contact:
                  type:
                  - string
                  - 'null'
                  description: URL to the brand's contact or contact us page
                blog:
                  type:
                  - string
                  - 'null'
                  description: URL to the brand's blog or news page
                pricing:
                  type:
                  - string
                  - 'null'
                  description: URL to the brand's pricing or plans page
              description: Important website links for the brand
            primary_language:
              anyOf:
              - allOf:
                - $ref: '#/components/schemas/SupportedLanguage'
              - type: 'null'
              description: The primary language of the brand's website content. Detected from the HTML lang tag, page content analysis, or social media descriptions.
          description: Detailed brand information
        code:
          type: integer
          description: HTTP status code
        cache_metadata:
          $ref: '#/components/schemas/CacheMetadata'
        key_metadata:
          $ref: '#/components/schemas/KeyMetadata'
        request_id:
          $ref: '#/components/schemas/RequestId'
      required:
      - status
      - brand
      - code
      - cache_metadata
      - request_id
    BrandRetrieveByEmailRequest:
      type: object
      properties:
        force_language:
          allOf:
          - $ref: '#/components/schemas/SupportedLanguage'
          - type:
            - string
            - 'null'
        maxSpeed:
          type: boolean
          description: Optional parameter to optimize the API call for maximum speed. When set to true, the API will skip time-consuming operations for faster response at the cost of less comprehensive data.
        maxAgeMs:
          type: integer
          description: Maximum age of cached brand data in ms. Defaults to 3 months; clamped to 0–1 year. `0` refreshes.
        timeoutOpts:
          $ref: '#/components/schemas/PartialTimeout'
        type:
          type: string
          enum:
          - by_email
          description: Discriminator for email-based brand retrieval.
        email:
          type: string
          minLength: 1
          format: email
          description: Email address to retrieve brand data for (e.g., 'jane@stripe.com').
        tags:
          $ref: '#/components/schemas/RequestTags'
      required:
      - type
      - email
      additionalProperties: false
      title: By email
      description: Retrieve brand data by email address. The domain is extracted from the email. Free and disposable email providers are rejected with 422. Cannot be combined with domain, name, or ticker.
    RequestId:
      type: string
      format: uuid
      description: Unique ID of this request, also in `X-Request-Id`. Include it when contacting support.
      example: 3f1c2a6e-8b4d-4c1e-9f0a-2d7b5e6c8a91
  headers:
    RateLimitLimit:
      description: Maximum request units per minute, or maximum concurrent requests when X-RateLimit-Mode is concurrency.
      schema:
        type: integer
        minimum: 1
    RateLimitMode:
      description: Set to concurrency when these headers report concurrent requests. When a per-minute limit also applies, its rejections report per-minute headers without this header. New Free accounts have 2 concurrent requests and 10 requests per minute; paid plans have no per-minute limit by default. Existing and custom allowances can differ.
      schema:
        type: string
        enum:
        - concurrency
    RateLimitRemaining:
      description: Request units remaining in the current minute, or concurrent requests still available when X-RateLimit-Mode is concurrency.
      schema:
        type: integer
        minimum: 0
    RequestId:
      description: Unique ID of this request; also `request_id` in JSON bodies.
      schema:
        type: string
        format: uuid
    RateLimitReset:
      description: Unix timestamp in seconds when the per-minute rate limit resets. Omitted for concurrency limits.
      schema:
        type: integer
  parameters:
    RequestTags:
      name: tags
      in: query
      required: false
      style: form
      explode: false
      schema:
        $ref: '#/components/schemas/RequestTags'
      description: Comma-separated labels for filtering usage, e.g. `production,team-alpha`.
      example: production,team-alpha
  responses:
    RateLimited:
      description: Rate limit exceeded. Organization concurrency rejections include structured error_data and subscription settings; follow Retry-After before retrying.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        X-RateLimit-Mode:
          $ref: '#/components/headers/RateLimitMode'
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
            maximum: 60
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: Human-readable error message.
              error_code:
                type: string
                enum:
                - RATE_LIMITED
                description: Error code indicating the rate limit was exceeded
              key_metadata:
                $ref: '#/components/schemas/KeyMetadata'
              error_data:
                $ref: '#/components/schemas/ConcurrencyErrorData'
              request_id:
                $ref: '#/components/schemas/RequestId'
            required:
            - request_id
            - message
            - error_code
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Send `Authorization: Bearer <API_KEY>`. Keys have full access unless restricted to scopes.'
