      description: List a monitor’s runs, newest first.
      x-mint:
        content: <Badge color="blue">0 credits</Badge>
      parameters:
      - schema:
          type: string
          description: ID of the monitor.
          example: mon_123
        required: true
        description: ID of the monitor.
        name: monitor_id
        in: path
      - schema:
          allOf:
          - $ref: '#/components/schemas/MonitorsRunStatus'
          - description: Filter runs by lifecycle status.
        required: false
        description: Filter runs by lifecycle status.
        name: status
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of items to return per page (1-100). Defaults to 25.
        required: false
        description: Maximum number of items to return per page (1-100). Defaults to 25.
        name: limit
        in: query
      - schema:
          type: string
          description: Opaque pagination cursor from a previous response.
        required: false
        description: Opaque pagination cursor from a previous response.
        name: cursor
        in: query
      responses:
        '200':
          description: A paginated list of runs for the monitor
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
