openapi: 3.2.0
info:
  title: Context.dev Monitors API
  description: Scrape, crawl, search, and monitor websites, and retrieve brand, people, and news data.
  version: 1.0.0
servers:
- url: https://api.context.dev/v1
tags:
- name: Monitors
  description: Watch websites for exact or meaningful changes.
paths:
  /monitors:
    post:
      summary: Create a monitor
      description: Watch a page, URL inventory, or extracted website data on a schedule. A run starts immediately to capture the baseline.
      operationId: createMonitor
      security:
      - bearerAuth: []
      tags:
      - Monitors
      x-mint:
        content: <Badge color="blue">1, 2, or 10 credits per run</Badge>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorsCreateMonitorRequest'
            examples:
              page_exact:
                summary: Exact page monitor
                value:
                  mode: web
                  name: Acme pricing page
                  target:
                    type: page
                    url: https://acme.com/pricing
                  change_detection:
                    type: exact
                  schedule:
                    type: interval
                    frequency: 6
                    unit: hours
                  webhook:
                    url: https://example.com/webhook
              sitemap_exact:
                summary: Exact sitemap monitor
                value:
                  mode: web
                  name: Acme sitemap
                  target:
                    type: sitemap
                    url: https://acme.com/sitemap.xml
                  change_detection:
                    type: exact
                  schedule:
                    type: interval
                    frequency: 1
                    unit: days
                  webhook:
                    url: https://example.com/webhook
              extract_semantic:
                summary: Semantic extract monitor
                value:
                  mode: web
                  name: Acme website positioning
                  target:
                    type: extract
                    url: https://acme.com
                    instructions: Extract the product positioning, pricing, packaging, and headline feature claims.
                    max_pages: 10
                  change_detection:
                    type: semantic
                  schedule:
                    type: interval
                    frequency: 1
                    unit: days
                  webhook:
                    url: https://example.com/webhook
      responses:
        '201':
          description: Monitor created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorsCreateMonitorResponse'
        '400':
          $ref: '#/components/responses/MonitorsBadRequest'
        '401':
          $ref: '#/components/responses/MonitorsUnauthorized'
        '403':
          $ref: '#/components/responses/MonitorsLimitExceeded'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      summary: List monitors
      description: List your monitors with optional search and filters.
      operationId: listMonitors
      security:
      - bearerAuth: []
      tags:
      - Monitors
      x-mint:
        content: <Badge color="blue">0 credits</Badge>
      parameters:
      - schema:
          type: string
          maxLength: 200
          description: Free-text search term, matched against the fields named in `search_by`.
          example: pricing
        required: false
        description: Free-text search term, matched against the fields named in `search_by`.
        name: q
        in: query
      - schema:
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - name
            - url
            - instructions
            - tags
          description: Fields to search with `q`. Defaults to all fields; page and extract targets can have instructions.
          example: name,url
        required: false
        description: Fields to search with `q`. Defaults to all fields; page and extract targets can have instructions.
        name: search_by
        in: query
      - schema:
          type: string
          enum:
          - exact
          - prefix
          description: '`prefix` for as-you-type prefix matching (default), `exact` for full-token matching.'
        required: false
        description: '`prefix` for as-you-type prefix matching (default), `exact` for full-token matching.'
        name: search_type
        in: query
      - schema:
          type: string
          enum:
          - active
          - paused
          - failed
          description: Filter monitors by lifecycle status.
        required: false
        description: Filter monitors by lifecycle status.
        name: status
        in: query
      - schema:
          type: string
          enum:
          - page
          - sitemap
          - extract
          description: Filter by target type.
        required: false
        description: Filter by target type.
        name: target_type
        in: query
      - schema:
          type: string
          enum:
          - exact
          - semantic
          description: Filter by change detection type.
        required: false
        description: Filter by change detection type.
        name: change_detection_type
        in: query
      - schema:
          type:
          - array
          - 'null'
          items:
            type: string
            minLength: 1
            maxLength: 50
          maxItems: 20
          description: Comma-separated list of tags to filter by (matches monitors having any of them).
          example: pricing,competitor
        required: false
        description: Comma-separated list of tags to filter by (matches monitors having any of them).
        name: tags
        in: query
      - schema:
          type: string
          description: Filter to items that have this tag.
          example: pricing
        required: false
        description: Filter to items that have this tag.
        name: tag
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of items to return per page (1-100). Defaults to 25.
        required: false
        description: Maximum number of items to return per page (1-100). Defaults to 25.
        name: limit
        in: query
      - schema:
          type: string
          description: Opaque pagination cursor from a previous response.
        required: false
        description: Opaque pagination cursor from a previous response.
        name: cursor
        in: query
      responses:
        '200':
          description: A paginated list of monitors
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorsListMonitorsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MonitorsUnauthorized'
        '403':
          description: API key permissions or organization settings do not allow this request.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Search is temporarily unavailable (`SEARCH_UNAVAILABLE`). Retry or list without search filters.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /monitors/{monitor_id}:
    get:
      summary: Retrieve a monitor
      operationId: getMonitor
      security:
      - bearerAuth: []
      tags:
      - Monitors
      description: Retrieve a monitor’s configuration and current state.
      x-mint:
        content: <Badge color="blue">0 credits</Badge>
      parameters:
      - schema:
          type: string
          description: ID of the monitor.
          example: mon_123
        required: true
        description: ID of the monitor.
        name: monitor_id
        in: path
      responses:
        '200':
          description: Monitor
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorsMonitorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MonitorsUnauthorized'
        '403':
          description: API key permissions or organization settings do not allow this request.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/MonitorsNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      summary: Update a monitor
      description: Update a monitor. Changing its target or change detection replaces the baseline and queues a new baseline run.
      operationId: updateMonitor
      security:
      - bearerAuth: []
      tags:
      - Monitors
      x-mint:
        content: <Badge color="blue">0 credits</Badge>
      parameters:
      - schema:
          type: string
          description: ID of the monitor.
          example: mon_123
        required: true
        description: ID of the monitor.
        name: monitor_id
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorsUpdateMonitorRequest'
            example:
              name: Acme pricing monitor
              status: active
              schedule:
                type: interval
                frequency: 1
                unit: hours
              webhook:
                url: https://example.com/webhook
      responses:
        '200':
          description: Updated monitor
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorsMonitorResponse'
        '400':
          $ref: '#/components/responses/MonitorsBadRequest'
        '401':
          $ref: '#/components/responses/MonitorsUnauthorized'
        '403':
          description: API key permissions or organization settings do not allow this request.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/MonitorsNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      summary: Delete a monitor
      operationId: deleteMonitor
      security:
      - bearerAuth: []
      tags:
      - Monitors
      description: Delete a monitor and stop future runs and webhook retries.
      x-mint:
        content: <Badge color="blue">0 credits</Badge>
      parameters:
      - schema:
          type: string
          description: ID of the monitor.
          example: mon_123
        required: true
        description: ID of the monitor.
        name: monitor_id
        in: path
      responses:
        '200':
          description: Monitor deleted
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorsDeleteMonitorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MonitorsUnauthorized'
        '403':
          description: API key permissions or organization settings do not allow this request.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/MonitorsNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /monitors/{monitor_id}/runs:
    get:
      summary: List monitor runs
      operationId: listMonitorRuns
