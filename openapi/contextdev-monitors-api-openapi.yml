          type: string
        added_urls:
          type: array
          items:
            type: string
            format: uri
          description: At most 500 URLs are included; the corresponding count field is always exact.
        removed_urls:
          type: array
          items:
            type: string
            format: uri
          description: At most 500 URLs are included; the corresponding count field is always exact.
        added_url_count:
          type: integer
          minimum: 0
        removed_url_count:
          type: integer
          minimum: 0
        matched_urls:
          type: array
          items:
            type: string
            format: uri
          description: At most 500 URLs are included; the corresponding count field is always exact.
        matched_url_count:
          type: integer
          minimum: 0
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/MonitorsEvidence'
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
