webhooks:
  monitorChangeDetected:
    post:
      summary: Monitor change detected
      description: Sent when a monitor detects a change. Return any 2xx response to acknowledge delivery. Slack incoming webhook destinations receive a formatted Slack message instead of this event envelope.
      operationId: monitorChangeDetected
      tags:
      - Monitors
      security: []
      parameters:
      - schema:
          type: string
          example: Context.dev-Webhooks/1.0
        required: true
        description: Identifies the Context.dev webhook sender.
        name: User-Agent
        in: header
      - schema:
          type: string
          enum:
          - change.detected
        required: true
        description: Event type for this delivery.
        name: X-Context-Event
        in: header
      - schema:
          type: string
          example: evt_123
        required: true
        description: Unique event ID. Matches the top-level `id` field in the request body.
        name: X-Context-Id
        in: header
      - schema:
          type: string
          example: whd_0123456789abcdef0123456789abcdef
        required: false
        description: Delivery ID for status checks and retries.
        name: X-Context-Delivery-Id
        in: header
      - schema:
          type: integer
          minimum: 1
        required: false
        description: Attempt number, starting at 1.
        name: X-Context-Attempt
        in: header
      - schema:
          type: string
          example: t=1783620012,v1=087d98aada1e39f9d24d65951f51e672da12b2f9ea1c02c7c8c5ef254f5d4068
        required: false
        description: '`t=<unix>,v1=<hmac>`: SHA-256 HMAC of `t.rawRequestBody`, keyed with the webhook secret. Verify with a constant-time comparison and reject stale timestamps.'
        name: X-Context-Signature
        in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorsChangeDetectedWebhookPayload'
      responses:
        2XX:
          description: Webhook accepted.
  monitorRunCompleted:
    post:
      summary: Monitor run completed
      description: Sent after each completed run, including unchanged runs. Return a 2xx response to acknowledge delivery.
      operationId: monitorRunCompleted
      tags:
      - Monitors
      security: []
      parameters:
      - schema:
          type: string
          example: Context.dev-Webhooks/1.0
        required: true
        description: Identifies the Context.dev webhook sender.
        name: User-Agent
        in: header
      - schema:
          type: string
          enum:
          - run.completed
        required: true
        description: Event type for this delivery.
        name: X-Context-Event
        in: header
      - schema:
          type: string
          example: evt_123
        required: true
        description: Unique event ID. Matches the top-level `id` field in the request body.
        name: X-Context-Id
        in: header
      - schema:
          type: string
          example: whd_0123456789abcdef0123456789abcdef
        required: false
        description: Delivery ID for status checks and retries.
        name: X-Context-Delivery-Id
        in: header
      - schema:
          type: integer
          minimum: 1
        required: false
        description: Attempt number, starting at 1.
        name: X-Context-Attempt
        in: header
      - schema:
          type: string
          example: t=1783620012,v1=087d98aada1e39f9d24d65951f51e672da12b2f9ea1c02c7c8c5ef254f5d4068
        required: false
        description: '`t=<unix>,v1=<hmac>`: SHA-256 HMAC of `t.rawRequestBody`, keyed with the webhook secret. Verify with a constant-time comparison and reject stale timestamps.'
        name: X-Context-Signature
        in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorsRunCompletedWebhookPayload'
      responses:
        2XX:
          description: Webhook accepted.
components:
  schemas:
    MonitorsSitemapTarget:
      type: object
      properties:
        type:
          type: string
          enum:
          - sitemap
          description: Use `sitemap` to watch a site for added or removed URLs.
        url:
          type: string
          format: uri
          description: Sitemap URL to monitor.
          example: https://acme.com/sitemap.xml
        include:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          maxItems: 50
          description: URL path patterns to include (max 50).
          example:
          - /blog/*
          - /pricing*
        exclude:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          maxItems: 50
          description: URL path patterns to exclude (max 50).
          example:
          - /legal/*
          - /privacy
        max_urls:
          type: integer
          minimum: 1
          maximum: 10000
          default: 5000
          description: Maximum number of sitemap URLs to track (capped at 10,000).
      required:
      - type
      - url
      additionalProperties: false
      description: Watch a site’s URL inventory for confirmed additions and removals.
      title: Sitemap target
    WebScrapePerformAction:
      type: object
      properties:
        do:
          type: string
          enum:
          - perform
          description: Use `perform` for a plain-language browser instruction.
        action:
          type: string
          minLength: 1
          maxLength: 500
          description: One browser instruction, such as clicking a button or entering text.
      required:
      - do
      - action
      additionalProperties: false
      description: Resolve and perform one natural-language browser action.
      title: Perform
    MonitorsWebhookConfig:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Public HTTP(S) URL that receives events. Slack and GovSlack URLs get formatted messages.
          example: https://example.com/webhook
        events:
          type: array
          items:
            type: string
            enum:
            - change.detected
            - run.completed
          minItems: 1
          maxItems: 2
          uniqueItems: true
          description: Events to deliver. Defaults to `change.detected`; `run.completed` also includes unchanged runs.
          example:
          - change.detected
          - run.completed
        retry:
          $ref: '#/components/schemas/WebhookRetry'
        secret:
          type: string
          readOnly: true
          description: API-generated signing secret. Visible only with full access or `monitors:write` permission.
          example: whsec_8f3a…
      required:
      - url
      additionalProperties: false
    MonitorsEvidence:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Optional URL the evidence relates to. Absent for whole-target diffs.
        before:
          type: string
          description: Snapshot of the content before the change.
        after:
          type: string
          description: Snapshot of the content after the change.
      required:
      - before
      - after
      additionalProperties: false
    MonitorsRunCompletedWebhookPayload:
      type: object
      properties:
        event:
          type: string
          enum:
          - run.completed
        id:
          type: string
          example: evt_123
        created_at:
          type: string
          format: date-time
          example: '2026-07-09T18:00:12.000Z'
        data:
          type: object
          properties:
            run:
              type: object
              properties:
                id:
                  type: string
                  example: run_123
                monitor_id:
                  type: string
                  example: mon_123
                status:
                  type: string
                  enum:
                  - completed
                run_type:
                  type: string
                  enum:
                  - baseline
                  - scheduled
                  description: A baseline run follows creation or a target or detection change.
                target_type:
                  $ref: '#/components/schemas/MonitorsTargetType'
                change_detection_type:
                  $ref: '#/components/schemas/MonitorsChangeDetectionType'
                started_at:
                  type: string
                  format: date-time
                completed_at:
                  type: string
                  format: date-time
                change_detected:
                  type: boolean
                  example: false
                change_id:
                  type:
                  - string
                  - 'null'
                  example: null
                baseline_created:
                  type: boolean
                  description: True when this run established the monitor's initial baseline; baseline runs perform no change detection.
              required:
              - id
              - monitor_id
              - status
              - run_type
              - target_type
              - change_detection_type
              - started_at
              - completed_at
              - change_detected
              - change_id
              - baseline_created
              additionalProperties: false
              title: Completed run snapshot
              description: Run snapshot at delivery time. Retrieve the run for its final usage details.
            change:
              anyOf:
              - $ref: '#/components/schemas/MonitorsChange'
              - type: 'null'
              description: The detected change — the same full change record delivered by change.detected — or null when the run found no change.
          required:
          - run
          - change
          additionalProperties: false
      required:
      - event
      - id
      - created_at
      - data
      additionalProperties: false
      title: Monitor run completed webhook payload
      description: 'Payload sent after every completed run when the monitor''s webhook subscribes to run.completed. A run with `change_detected: false` is a confirmation that the monitor ran and found no change.'
    MonitorsChangeDetectionType:
      type: string
      enum:
      - exact
      - semantic
    MonitorsNullableWebhookConfig:
      description: Webhook destination and delivery settings. Null means no webhook is configured.
      anyOf:
      - allOf:
        - $ref: '#/components/schemas/MonitorsWebhookConfig'
      - type: 'null'
    MonitorsCreditUsageResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MonitorsCreditUsage'
        total_credits:
          type: integer
          description: Sum of credits across all monitors in the window.
        request_id:
          $ref: '#/components/schemas/RequestId'
        key_metadata:
          $ref: '#/components/schemas/KeyMetadata'
      required:
      - data
      - total_credits
      - request_id
      additionalProperties: false
      title: Monitor credit usage response
    MonitorsCreateMonitorRequest:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/MonitorsMode'
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Display name for the monitor.
          example: Acme pricing monitor
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          maxItems: 20
          uniqueItems: true
          description: Labels for filtering monitors, their changes, and their usage.
          example:
          - pricing
          - competitor
        target:
          $ref: '#/components/schemas/MonitorsTarget'
        change_detection:
          $ref: '#/components/schemas/MonitorsChangeDetection'
        schedule:
          $ref: '#/components/schemas/MonitorsSchedule'
        webhook:
          $ref: '#/components/schemas/MonitorsNullableWebhookConfig'
      required:
      - name
      - target
      additionalProperties: false
      title: Create monitor request
      description: Monitor target, detection method, and schedule. Omitted schedules run daily.
    MonitorsTarget:
      oneOf:
      - $ref: '#/components/schemas/MonitorsPageTarget'
      - $ref: '#/components/schemas/MonitorsSitemapTarget'
      - allOf:
        - $ref: '#/components/schemas/MonitorsExtractTarget'
        - description: Track relevant pages selected by `schema` and `instructions`; refresh the page set periodically.
      discriminator:
        propertyName: type
        mapping:
          page: '#/components/schemas/MonitorsPageTarget'
          sitemap: '#/components/schemas/MonitorsSitemapTarget'
          extract: '#/components/schemas/MonitorsExtractTarget'
      description: 'What to watch: a page, a sitemap, or data extracted from a site.'
    MonitorsMonitor:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/MonitorsMode'
        id:
          type: string
          example: mon_123
        name:
          type: string
          example: Acme pricing monitor
        target:
          $ref: '#/components/schemas/MonitorsTarget'
        change_detection:
          $ref: '#/components/schemas/MonitorsChangeDetection'
        schedule:
          $ref: '#/components/schemas/MonitorsSchedule'
        webhook:
          $ref: '#/components/schemas/MonitorsNullableWebhookConfig'
        status:
          $ref: '#/components/schemas/MonitorsMonitorStatus'
        last_run_at:
          type:
          - string
          - 'null'
          format: date-time
        last_change_at:
          type:
          - string
          - 'null'
          format: date-time
        next_run_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the next scheduled run is due; null while paused.
        last_error:
          anyOf:
          - allOf:
            - $ref: '#/components/schemas/MonitorsRunError'
          - type: 'null'
          description: Error from the most recent failed run; null when the last run succeeded.
        webhook_failure:
          anyOf:
          - $ref: '#/components/schemas/MonitorsWebhookFailure'
          - type: 'null'
          description: Present while webhook deliveries are failing consecutively; null when deliveries are healthy or no webhook is configured. Cleared on the next successful delivery and when the webhook URL changes.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          maxItems: 20
          uniqueItems: true
          description: Labels for filtering monitors, their changes, and their usage.
          example:
          - pricing
          - competitor
        baseline:
          oneOf:
          - $ref: '#/components/schemas/MonitorsPageBaseline'
          - $ref: '#/components/schemas/MonitorsSitemapBaseline'
          - $ref: '#/components/schemas/MonitorsExtractBaseline'
          - type: 'null'
          description: Comparison baseline, included on Retrieve. Null until capture completes or after target changes.
      required:
      - mode
      - id
      - name
      - target
      - change_detection
      - schedule
      - status
      - created_at
      - updated_at
      additionalProperties: false
      title: Monitor
      description: A web monitor. `mode` is the constant `web`; behavior is described by `target` (page/sitemap/extract) and `change_detection` (exact/semantic).
    MonitorsSemanticChangeDetection:
      type: object
      properties:
        type:
          type: string
          enum:
          - semantic
          description: Use `semantic` to judge changes against the target instructions.
        confidence_threshold:
          type: number
          minimum: 0
          maximum: 1
          default: 0.75
          description: Minimum confidence required to report a meaningful change, from 0 to 1.
      required:
      - type
      additionalProperties: false
      description: Detect meaningful content changes using the target’s instructions and optional schema.
      title: Semantic
    MonitorsExtractTarget:
      type: object
      properties:
        type:
          type: string
          enum:
          - extract
          description: Use `extract` to watch structured data across selected pages.
        url:
          type: string
          format: uri
          description: Root URL to extract structured data from.
          example: https://acme.com
        schema:
          type: object
          additionalProperties: {}
          description: JSON Schema for page selection and the baseline snapshot. Changes return diffs and evidence.
          example:
            type: object
            properties:
              plans:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    price:
                      type: string
        instructions:
          type: string
          minLength: 1
          maxLength: 2000
          description: Natural-language instructions guiding which pages and facts to track and which changes to report.
          example: Extract every pricing plan with its monthly price and included limits.
        max_pages:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
          description: Maximum number of pages to track.
        max_depth:
          type: integer
          minimum: 0
          maximum: 10
          description: Optional maximum link depth from the starting URL (0 = only the starting page).
        follow_subdomains:
          type: boolean
          default: false
          description: Allow page discovery on subdomains of the target site.
      required:
      - type
      - url
      - instructions
      additionalProperties: false
      title: Extract target
    WebScrapeAction:
      oneOf:
      - $ref: '#/components/schemas/WebScrapeWaitAction'
      - $ref: '#/components/schemas/WebScrapePerformAction'
      - $ref: '#/components/schemas/WebScrapeScrollAction'
      discriminator:
        propertyName: do
        mapping:
          wait: '#/components/schemas/WebScrapeWaitAction'
          perform: '#/components/schemas/WebScrapePerformAction'
          scroll: '#/components/schemas/WebScrapeScrollAction'
      description: Browser action discriminated by `do`. Each variant exposes only its applicable fields.
    MonitorsChangeDetection:
      oneOf:
      - $ref: '#/components/schemas/MonitorsExactChangeDetection'
      - $ref: '#/components/schemas/MonitorsSemanticChangeDetection'
      discriminator:
        propertyName: type
        mapping:
          exact: '#/components/schemas/MonitorsExactChangeDetection'
          semantic: '#/components/schemas/MonitorsSemanticChangeDetection'
      description: How changes are judged. Defaults to `semantic` for extract targets and page targets with `instructions`, otherwise `exact`.
    MonitorsNullableRunError:
      anyOf:
      - allOf:
        - $ref: '#/components/schemas/MonitorsRunError'
      - type: 'null'
    MonitorsTargetType:
      type: string
      enum:
      - page
      - sitemap
      - extract
    MonitorsDeleteMonitorResponse:
      type: object
      properties:
        id:
          type: string
          example: mon_123
        deleted:
          type: boolean
          example: true
        request_id:
          $ref: '#/components/schemas/RequestId'
        key_metadata:
          $ref: '#/components/schemas/KeyMetadata'
      required:
      - id
      - deleted
      - request_id
      additionalProperties: false
    MonitorsIntervalSchedule:
      type: object
      properties:
        type:
          type: string
          enum:
          - interval
          description: Use `interval` to run on a repeating schedule.
        frequency:
          type: integer
          minimum: 1
          maximum: 525600
          description: Number of units between runs. The resulting interval (frequency × unit) must be at least 10 minutes and at most 1 year (e.g. minimum 10 when unit is minutes; maximum 365 when unit is days).
          example: 6
        unit:
          $ref: '#/components/schemas/MonitorsScheduleUnit'
      required:
      - type
      - frequency
      - unit
      additionalProperties: false
      description: Run the monitor on a fixed interval defined by a frequency and a unit, e.g. every 6 hours or every 2 days. The total interval (frequency × unit) must be between 10 minutes and 1 year.
      title: Interval
    MonitorsExtractBaseline:
      type: object
      properties:
        data:
          description: Latest structured snapshot matching the extraction schema, refreshed at most daily; `null` before capture.
          example:
            plans:
            - name: Starter
              price: $9/mo
        urls_analyzed:
          type: array
          items:
            type: string
          description: The page URLs the monitor tracks and analyzes for changes.
          example:
          - https://acme.com/pricing
        captured_at:
          type: string
          format: date-time
          description: When this baseline was last captured or replaced.
      required:
      - data
      - urls_analyzed
      - captured_at
      additionalProperties: false
      title: Extract baseline
      description: 'Current baseline of an `extract` monitor: the pages it tracks and the structured data as last extracted.'
    MonitorsChangeDetectedWebhookPayload:
      type: object
      properties:
        event:
          type: string
          enum:
          - change.detected
        id:
          type: string
          example: evt_123
        created_at:
          type: string
          format: date-time
          example: '2026-07-09T18:00:12.000Z'
        data:
          type: object
          properties:
            change:
              $ref: '#/components/schemas/MonitorsChange'
          required:
          - change
          additionalProperties: false
      required:
      - event
      - id
      - created_at
      - data
      additionalProperties: false
      title: Monitor change detected webhook payload
      description: Payload sent when a monitor detects a change. The nested change is the same full change record returned by GET /monitors/changes/{change_id}.
    MonitorsLimitsResponse:
      type: object
      properties:
        monitors_used:
          type: integer
          description: Number of monitors the account currently has.
        monitors_limit:
          type: integer
          description: 'Most monitors you can have: your plan''s allowance or a custom limit.'
        plan:
          type: string
          enum:
          - free
          - starter
          - pro
          - scale
          description: '`starter` means Developer; `pro` means Pro or Growth; `scale` means Scale or Enterprise.'
        request_id:
          $ref: '#/components/schemas/RequestId'
        key_metadata:
          $ref: '#/components/schemas/KeyMetadata'
      required:
      - monitors_used
      - monitors_limit
      - plan
      - request_id
      additionalProperties: false
      title: Monitor limits response
    MonitorsMode:
      type: string
      enum:
      - web
      description: Always `web`. Optional.
      title: Monitor mode
    MonitorsPageTarget:
      type: object
      properties:
        type:
          type: string
          enum:
          - page
          description: Use `page` to watch one web page.
        url:
          type: string
          format: uri
          description: Public HTTP(S) page URL to monitor.
          example: https://acme.com/pricing
        instructions:
          type: string
          minLength: 1
          maxLength: 2000
          description: Plain-language goal describing which page changes matter. When provided without change_detection, semantic detection is inferred.
          example: Report pricing or plan availability changes. Ignore counters, timestamps, testimonials, and navigation.
        normalize_whitespace:
          type: boolean
          default: true
          description: Normalize whitespace before comparing or analyzing text.
        include_selectors:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 2048
          maxItems: 50
          description: Monitor these CSS-selected regions. Empty or omitted uses main content. Changes create a new baseline.
          example:
          - '#attraction-details'
        exclude_selectors:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 2048
          maxItems: 50
          description: Remove matching regions after inclusions. Changes create a new baseline.
          example:
          - .carousel
          - '[id^="TA_"]'
        actions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/WebScrapeAction'
          maxItems: 5
          description: 'Optional browser actions executed in array order after the page loads, before content is captured, on every run. Requires a paid plan. Maximum: 5 actions. Changes create a new baseline.'
      required:
      - type
      - url
      additionalProperties: false
      description: Watch a single web page. Exact detection reports visible-text diffs; semantic detection judges confirmed stable diffs against `instructions`.
      title: Page target
    WebScrapeScrollAction:
      type: object
      properties:
        do:
          type: string
          enum:
          - scroll
          description: Use `scroll` to move through the page or a container.
        direction:
          type: string
          enum:
          - up
          - down
          - left
          - right
          description: Direction to scroll. Defaults to down.
        amount:
          anyOf:
          - type: integer
            minimum: 1
            maximum: 100000
          - type: string
            enum:
            - viewport
            - max
          description: Pixels per scroll, one visible viewport, or the current scroll boundary. Defaults to viewport.
        container:
          type: string
          minLength: 1
          maxLength: 2000
          description: CSS selector for the first matching scroll container. Defaults to the page.
        maxScrolls:
          type: integer
          minimum: 1
          maximum: 50
          description: Maximum scroll iterations. Stops early when scrolling and scrollable extent stop changing. Defaults to 1.
      required:
      - do
      additionalProperties: false
      description: Scroll the page or a selected scrollable container, waiting adaptively for content and dimensions to settle after each iteration.
      title: Scroll
    MonitorsPageBaseline:
      type: object
      properties:
        text:
          type: string
          description: The page's visible text as last observed.
          example: 'Acme Pricing

            Starter $9/mo…'
        captured_at:
          type: string
          format: date-time
          description: When this baseline was last captured or replaced.
      required:
      - text
      - captured_at
      additionalProperties: false
      title: Page baseline
      description: 'Current baseline of a `page` monitor: the visible page text as last observed.'
    ConcurrencyErrorData:
      type: object
      properties:
        is_authenticated:
          type: boolean
          enum:
          - true
        limit_type:
          type: string
          enum:
          - concurrency
        limit:
          type: number
          minimum: 0
        remaining:
          type: number
          minimum: 0
        retry_after_seconds:
          type: number
          minimum: 0
        credits_remaining:
          type: number
          minimum: 0
        credits_charged:
          type: number
          enum:
          - 0
        should_retry:
          type: boolean
          enum:
          - false
        retry_condition:
          type: string
          enum:
          - available_concurrency
        recovery_options:
          type: array
          items:
            type: string
            enum:
            - wait_for_in_flight_requests
            - increase_concurrency_limit
        info_url:
          type: string
          enum:
          - https://context.dev/dashboard/subscription
      required:
      - is_authenticated
      - limit_type
      - limit
      - remaining
      - retry_after_seconds
      - credits_charged
      - should_retry
      - retry_condition
      - recovery_options
      - info_url
      description: Organization concurrency rejection details. Authentication is valid and no credits were charged. should_retry is false immediately; respect retry_after_seconds and wait for an in-flight request to finish or for the effective concurrency limit to increase. info_url opens subscription settings; no higher allowance is guaranteed for a particular account.
    MonitorsSitemapBaseline:
      type: object
      properties:
        urls:
          type: array
          items:
            type: string
          description: The sitemap URLs as last observed (sorted, normalized).
          example:
          - https://acme.com/blog/launch
          - https://acme.com/pricing
        url_count:
          type: integer
          description: Number of URLs in the baseline.
          example: 2
        captured_at:
          type: string
          format: date-time
          description: When this baseline was last captured or replaced.
      required:
      - urls
      - url_count
      - captured_at
      additionalProperties: false
      title: Sitemap baseline
      description: 'Current baseline of a `sitemap` monitor: the normalized URL set as last observed.'
    KeyMetadata:
      type: object
      properties:
        credits_consumed:
          type: integer
          description: Credits charged for this request.
        credits_remaining:
          type: integer
          description: Credits remaining for your organization.
      required:
      - credits_consumed
      - credits_remaining
      description: Credits this request used and your remaining balance.
    BillingErrorData:
      type: object
      properties:
        is_authenticated:
          type: boolean
          enum:
          - true
        credits_remaining:
          type: number
          minimum: 0
        credits_required:
          type: number
          minimum: 0
        is_credits_required_estimated:
          type: boolean
        credits_charged:
          type: number
          minimum: 0
        should_retry:
          type: boolean
          enum:
          - false
        retry_condition:
          type: string
          enum:
          - sufficient_credits
        next_refill_at:
          type: string
          format: date-time
        next_refill_credits:
          type: number
          exclusiveMinimum: 0
        info_url:
          type: string
          enum:
          - https://context.dev/dashboard/subscription
      required:
      - is_authenticated
      - should_retry
      - retry_condition
      - info_url
      description: Credit admission or reservation failure details. credits_required is an admission estimate, not a final charge. should_retry is false for an unchanged request immediately; retry_condition requires sufficient account credits. Unknown balances, costs, and refill details are omitted. next_refill_at is an ISO 8601 UTC timestamp. Existing request_id and key_metadata remain on the error envelope.
    MonitorsRun:
      type: object
      properties:
        webhook_delivery_ids:
          type: array
          items:
            type: string
          description: Webhook delivery IDs for this run.
        id:
          type: string
          example: run_123
        monitor_id:
          type: string
          example: mon_123
        status:
          $ref: '#/components/schemas/MonitorsRunStatus'
        run_type:
          type: string
          enum:
          - baseline
          - scheduled
          description: A baseline run follows creation or a target or detection change.
        target_type:
          $ref: '#/components/schemas/MonitorsTargetType'
        change_detection_type:
          $ref: '#/components/schemas/MonitorsChangeDetectionType'
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        change_detected:
          type: boolean
          example: true
        change_id:
          type:
          - string
          - 'null'
          example: chg_123
        baseline_created:
          type: boolean
          description: True when this run established the monitor's initial baseline; baseline runs perform no change detection.
        credits_charged:
          type: integer
          minimum: 0
          description: Credits charged for this run (0 for skipped/failed runs).
          example: 1
        skip_reason:
          type:
          - string
          - 'null'
          enum:
          - insufficient_credits
          - monitor_paused
          - superseded
          - null
          description: Why a skipped run never executed; null unless status is `skipped`.
        error:
          $ref: '#/components/schemas/MonitorsNullableRunError'
        webhook_delivery:
          $ref: '#/components/schemas/MonitorsWebhookDelivery'
          deprecated: true
          description: Deprecated. Use `webhook_deliveries` for all attempts.
        webhook_deliveries:
          type: array
          items:
            $ref: '#/components/schemas/MonitorsWebhookDelivery'
          description: All webhook deliveries attempted by this run — one per subscribed event that fired. Omitted when no webhook was attempted, including runs created before event selection was added.
      required:
      - id
      - monitor_id
      - status
      - run_type
      - target_type
      - change_detection_type
      - change_detected
      - baseline_created
      - credits_charged
      additionalProperties: false
    MonitorsMonitorStatus:
      type: string
      enum:
      - active
      - paused
      - failed
      description: 'Current state. Failed monitors keep running; paused monitors must be resumed with `status: "active"`.'
    MonitorsListMonitorsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MonitorsMonitor'
        has_more:
          type: boolean
        next_cursor:
          type:
          - string
          - 'null'
        request_id:
          $ref: '#/components/schemas/RequestId'
        key_metadata:
          $ref: '#/components/schemas/KeyMetadata'
      required:
      - data
      - has_more
      - next_cursor
      - request_id
      additionalProperties: false
    MonitorsListRunsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MonitorsRun'
        has_more:
          type: boolean
        next_cursor:
          type:
          - string
          - 'null'
        request_id:
          $ref: '#/components/schemas/RequestId'
        key_metadata:
          $ref: '#/components/schemas/KeyMetadata'
      required:
      - data
      - has_more
      - next_cursor
      - request_id
      additionalProperties: false
    MonitorsSchedule:
      oneOf:
      - $ref: '#/components/schemas/MonitorsIntervalSchedule'
      discriminator:
        propertyName: type
        mapping:
          interval: '#/components/schemas/MonitorsIntervalSchedule'
      description: How often the monitor runs. Defaults to once a day.
    MonitorsExactChangeDetection:
      type: object
      properties:
        type:
          type: string
          enum:
          - exact
          description: Use `exact` to compare visible text or sitemap URLs.
      required:
      - type
      additionalProperties: false
      description: Detect exact changes. For page targets, this means visible text diffs. For sitemap targets, this means URL additions and removals.
      title: Exact
    MonitorsRunError:
      type: object
      properties:
        code:
          type: string
          example: fetch_failed
        message:
          type: string
          example: The target URL could not be fetched.
      required:
      - code
      - message
      additionalProperties: false
    MonitorsRunNowResponse:
      type: object
      properties:
        monitor_id:
          type: string
          example: mon_123
        run_id:
          type: string
          example: run_123
          description: ID of the queued run; pass it to Retrieve a monitor run.
        queued:
          type: boolean
          example: true
        request_id:
          $ref: '#/components/schemas/RequestId'
        key_metadata:
          $ref: '#/components/schemas/KeyMetadata'
      required:
      - monitor_id
      - run_id
      - queued
      - request_id
      additionalProperties: false
    MonitorsScheduleUnit:
      type: string
      enum:
      - minutes
      - hours
      - days
      description: Time unit used with `frequency` to set the run interval.
      example: hours
    MonitorsListChangesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MonitorsChange'
        has_more:
          type: boolean
        next_cursor:
          type:
          - string
          - 'null'
        request_id:
          $ref: '#/components/schemas/RequestId'
        key_metadata:
          $ref: '#/components/schemas/KeyMetadata'
      required:
      - data
      - has_more
      - next_cursor
      - request_id
      additionalProperties: false
    WebScrapeWaitAction:
      type: object
      properties:
        do:
          type: string
          enum:
          - wait
          description: Use `wait` to pause for a fixed duration.
        timeMs:
          type: integer
          minimum: 0
          maximum: 30000
          description: Time to pause in milliseconds before the next action.
      required:
      - do
      - timeMs
      additionalProperties: false
      description: Pause for a fixed number of milliseconds before continuing to the next action.
      title: Wait
    MonitorsUpdateMonitorRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Display name for the monitor.
          example: Acme pricing monitor
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          maxItems: 20
          uniqueItems: true
          description: Labels for filtering monitors, their changes, and their usage.
          example:
          - pricing
          - competitor
        status:
          type: string
          enum:
          - active
          - paused
          description: Set `paused` to stop scheduled runs or `active` to resume them.
        target:
          $ref: '#/components/schemas/MonitorsTarget'
        change_detection:
          $ref: '#/components/schemas/MonitorsChangeDetection'
        schedule:
          $ref: '#/components/schemas/MonitorsSchedule'
        webhook:
          $ref: '#/components/schemas/MonitorsNullableWebhookConfig'
          description: Set to null to remove the webhook. Changing `url` issues a new secret.
      additionalProperties: false
      description: Send only the fields to change. `target` replaces the whole target.
    MonitorsChange:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/MonitorsMode'
        id:
          type: string
          example: chg_123
        monitor_id:
          type: string
          example: mon_123
        run_id:
          type: string
          example: run_123
          description: The run that detected this change.
        target_type:
          $ref: '#/components/schemas/MonitorsTargetType'
        change_detection_type:
          $ref: '#/components/schemas/MonitorsChangeDetectionType'
        title:
          type: string
          example: Acme pricing page changed
        summary:
          type: string
          example: The visible text on the page changed.
        detected_at:
          type: string
          format: date-time
        url:
          type: string
          format: uri
        importance:
          $ref: '#/components/schemas/MonitorsImportance'
        confidence:
          type: number
          minimum: 0
          maximum: 1
        diff:
          type: string
          description: Text diff between the previous and current page baseline (page targets).
        before_text_excerpt:
          type: string
        after_text_excerpt:
          type: string
        added_urls:
          type: array
          items:
            type: string
            format: uri
          description: At most 500 URLs are included; the corresponding count field is always exact.
        removed_urls:
          type: array
          items:
            type: string
            format: uri
          description: At most 500 URLs are included; the corresponding count field is always exact.
        added_url_count:
          type: integer
          minimum: 0
        removed_url_count:
          type: integer
          minimum: 0
        matched_urls:
          type: array
          items:
            type: string
            format: uri
          description: At most 500 URLs are included; the corresponding count field is always exact.
        matched_url_count:
          type: integer
          minimum: 0
        evidence:
          type: array
          items:
