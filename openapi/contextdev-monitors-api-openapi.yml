        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MonitorsUnauthorized'
        '403':
          description: API key permissions or organization settings do not allow this request.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/MonitorsNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /monitors/{monitor_id}/runs/{run_id}:
    get:
      summary: Retrieve a monitor run
      description: Retrieve the status, timing, and results of one monitor run.
      operationId: getMonitorRun
      security:
      - bearerAuth: []
      tags:
      - Monitors
      x-mint:
        content: <Badge color="blue">0 credits</Badge>
      parameters:
      - schema:
          type: string
          description: ID of the monitor.
          example: mon_123
        required: true
        description: ID of the monitor.
        name: monitor_id
        in: path
      - schema:
          type: string
          description: ID of the monitor run.
          example: run_123
        required: true
        description: ID of the monitor run.
        name: run_id
        in: path
      responses:
        '200':
          description: The requested monitor run
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorsRunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MonitorsUnauthorized'
        '403':
          description: API key permissions or organization settings do not allow this request.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/MonitorsNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /monitors/{monitor_id}/changes:
    get:
      summary: List monitor changes
      operationId: listMonitorChanges
      security:
      - bearerAuth: []
      tags:
      - Monitors
      description: List full change records for a monitor, newest first.
      x-mint:
        content: <Badge color="blue">0 credits</Badge>
      parameters:
      - schema:
          type: string
          description: ID of the monitor.
          example: mon_123
        required: true
        description: ID of the monitor.
        name: monitor_id
        in: path
      - schema:
          type: string
          description: Filter to items that have this tag.
          example: pricing
        required: false
        description: Filter to items that have this tag.
        name: tag
        in: query
      - schema:
          type: string
          format: date-time
          description: Only include items at or after this ISO 8601 timestamp.
          example: '2026-06-01T00:00:00Z'
        required: false
        description: Only include items at or after this ISO 8601 timestamp.
        name: since
        in: query
      - schema:
          type: string
          format: date-time
          description: Only include items before this ISO 8601 timestamp.
          example: '2026-06-28T00:00:00Z'
        required: false
        description: Only include items before this ISO 8601 timestamp.
        name: until
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of items to return per page (1-100). Defaults to 25.
        required: false
        description: Maximum number of items to return per page (1-100). Defaults to 25.
        name: limit
        in: query
      - schema:
          type: string
          description: Opaque pagination cursor from a previous response.
        required: false
        description: Opaque pagination cursor from a previous response.
        name: cursor
        in: query
      responses:
        '200':
          description: A paginated list of changes for the monitor
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorsListChangesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MonitorsUnauthorized'
        '403':
          description: API key permissions or organization settings do not allow this request.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/MonitorsNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
