openapi: 3.2.0
info:
  title: Context.dev Web Extraction API
  description: Scrape, crawl, search, and monitor websites, and retrieve brand, people, and news data.
  version: 1.0.0
servers:
- url: https://api.context.dev/v1
tags:
- name: Web Extraction
paths:
  /web/extract:
    post:
      summary: Extract structured data
      description: Extract website data using your JSON Schema and instructions.
      security:
      - bearerAuth: []
      tags:
      - Web Extraction
      x-mint:
        content: <Badge color="blue">10 credits</Badge>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  minLength: 1
                  format: uri
                  description: The starting website URL to crawl and extract from. Must include http:// or https://.
                schema:
                  type: object
                  additionalProperties: {}
                  description: JSON Schema (not an example object) for the returned object. Image fields include relevant page image references.
                  example:
                    type: object
                    properties:
                      mission_statement:
                        type: string
                        description: The company's stated mission.
                      case_studies:
                        type: array
                        items:
                          type: object
                          properties:
                            title:
                              type: string
                            url:
                              type: string
                          required:
                          - title
                          - url
                          additionalProperties: false
                    required:
                    - mission_statement
                    - case_studies
                    additionalProperties: false
                instructions:
                  type: string
                  maxLength: 2000
                  description: Optional extraction guidance, such as which facts to prioritize or how to interpret fields in the schema.
                factCheck:
                  type: boolean
                  default: false
                  description: Require facts stated on the page. Unsupported fields become null or empty.
                followSubdomains:
                  type: boolean
                  default: false
                  description: When true, follow links on subdomains of the starting URL's domain.
                maxPages:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 5
                  description: 'Maximum number of pages to analyze for extraction. Hard cap: 50. Defaults to 5.'
                maxDepth:
                  type: integer
                  minimum: 0
                  description: Optional maximum link depth from the starting URL (0 = only the starting page). If omitted, there is no crawl depth limit.
                pdf:
                  type: object
                  properties:
                    shouldParse:
                      type: boolean
                      default: true
                      description: When true, PDF pages are fetched and parsed. When false, PDF pages are skipped.
                    start:
                      type: integer
                      minimum: 1
                      description: First 1-based PDF page to parse.
                    end:
                      type: integer
                      minimum: 1
                      description: Last PDF page to parse (1-based, inclusive). Defaults to the final page. Must be >= start.
                  default:
                    shouldParse: true
                  additionalProperties: false
                  description: PDF handling. `start`/`end` limit parsing to an inclusive, 1-based page range.
                includeFrames:
                  type: boolean
                  default: false
                  description: When true, iframe contents are included in Markdown before extraction.
                maxAgeMs:
                  type:
                  - integer
                  - 'null'
                  minimum: 0
                  maximum: 2592000000
                  default: 604800000
                  description: Return cached scrape results if a prior scrape for the same parameters is younger than this many milliseconds. Defaults to 7 days (604800000 ms).
                waitForMs:
                  type:
                  - integer
                  - 'null'
                  minimum: 0
                  maximum: 30000
                  description: Optional browser wait time in milliseconds after initial page load for each crawled page.
                settleAnimations:
                  type: boolean
                  default: false
                  description: Wait briefly for CSS animations and transitions to settle before reading each page.
                actions:
                  type:
                  - array
                  - 'null'
                  items:
                    $ref: '#/components/schemas/WebScrapeAction'
                  maxItems: 5
                  description: Browser steps before page discovery. Requires a paid plan; defaults the crawl budget to 110000 ms.
                stopAfterMs:
                  type: integer
                  minimum: 10000
                  default: 80000
                  maximum: 110000
                  description: 'Soft time budget for the crawl in milliseconds. Min: 10000 (10s). Max: 110000 (110s). Defaults to 80000 (80s), or 110000 (110s) when browser actions are provided.'
                timeoutOpts:
                  $ref: '#/components/schemas/PartialTimeout'
                zdr:
                  type: string
                  enum:
                  - enabled
                  - disabled
                  default: disabled
                  description: '`enabled` turns on zero data retention. Returns 403 `ZDR_NOT_ENABLED` unless your organization has ZDR.'
                tags:
                  $ref: '#/components/schemas/RequestTags'
              required:
              - url
              - schema
              additionalProperties: false
      responses:
        '200':
          description: Successful response
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
            X-Context-ZDR:
              description: Present with the value true when zero data retention was requested and honored.
              schema:
                type: string
                enum:
                - 'true'
          content:
            application/json:
              schema:
                type: object
                properties:
                  partial:
                    type: boolean
                    description: True when the timeout ended processing and this response contains only usable results completed so far. Unfinished results are omitted.
                  status:
                    type: string
                    description: Always `ok` on success.
                  url:
                    type: string
                    description: The starting URL that was analyzed
                  urls_analyzed:
                    type: array
                    items:
                      type: string
                    description: List of URLs whose Markdown was used for extraction
                  data:
                    type: object
                    additionalProperties: {}
                    description: Extracted data matching the request schema
                  metadata:
                    type: object
                    properties:
                      numUrls:
                        type: integer
                      maxCrawlDepth:
                        type: integer
                      numSucceeded:
                        type: integer
                      numFailed:
                        type: integer
                      numSkipped:
                        type: integer
                      numBlocked:
                        type: integer
                        description: Number of crawled pages excluded because they were anti-bot challenges, error pages, or parked-domain placeholders.
                      actionsApplied:
                        type: array
                        items:
                          type: object
                          properties:
                            instruction:
                              type: string
                            status:
                              type: string
                              enum:
                              - applied
                              - failed
                              - skipped
                              description: Applied means the requested page state was visibly verified. Failed means it was not verified. Skipped means it was not attempted.
                            method:
                              type: string
                            targetDescription:
                              type: string
                            completionEvidence:
                              type: string
                              description: Visible page evidence used to verify an applied action.
                            error:
                              type: string
                            durationMs:
                              type: number
                          required:
                          - instruction
                          - status
                        description: One verified outcome per requested browser action, in request order.
                    required:
                    - numUrls
                    - maxCrawlDepth
                    - numSucceeded
                    - numFailed
                    - numSkipped
                    - numBlocked
                  key_metadata:
                    $ref: '#/components/schemas/KeyMetadata'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
                  cache_metadata:
                    $ref: '#/components/schemas/CacheMetadata'
                required:
                - status
                - url
                - urls_analyzed
                - data
                - metadata
                - request_id
                - cache_metadata
        '400':
          description: Bad request - Invalid URL, schema, or inaccessible website
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error_code:
                    type: string
                    enum:
                    - INPUT_VALIDATION_ERROR
                    - TIMEOUT_TOO_SHORT_FOR_WAIT
                    - WEBSITE_ACCESS_ERROR
                    description: TIMEOUT_TOO_SHORT_FOR_WAIT means timeoutOpts.milliseconds is shorter than waitForMs plus the page-load margin; raise timeoutOpts.milliseconds or lower waitForMs.
                  key_metadata:
                    $ref: '#/components/schemas/KeyMetadata'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
                required:
                - message
                - error_code
                - request_id
        '401':
          description: Unauthorized - Invalid or missing API key
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Insufficient credits (`USAGE_EXCEEDED`); authentication is valid. Retry once funded. Legacy deployments may return 401.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: API key permissions or organization settings do not allow this request.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: Request timeout
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Internal server error
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: postWebExtract
      x-operation-id-source: derived
  /web/styleguide:
    get:
      summary: Extract a styleguide
      description: Extract colors, typography, spacing, and component styles from a website.
      x-oneOf-query:
      - title: By Domain
        required:
        - domain
        properties:
          domain:
            type: string
            description: Domain name to extract styleguide from (e.g., 'example.com', 'google.com').
          maxAgeMs:
            type: integer
            minimum: 0
            maximum: 31536000000
            default: 7776000000
            description: Maximum age in milliseconds for cached styleguide data before a hard refresh. Defaults to 3 months. Set to 0 to always perform a hard refresh.
          colorScheme:
            type: string
            enum:
            - light
            - dark
            description: Optional browser color scheme to emulate for websites that respond to prefers-color-scheme. This value is part of the styleguide cache key.
          timeoutOpts:
            $ref: '#/components/schemas/ScrapeTimeout'
          zdr:
            type: string
            enum:
            - enabled
            - disabled
            default: disabled
            description: '`enabled` turns on zero data retention. Returns 403 `ZDR_NOT_ENABLED` unless your organization has ZDR.'
      - title: By Direct URL
        required:
        - directUrl
        properties:
          directUrl:
            type: string
            format: uri
            description: A specific URL to fetch the styleguide from directly, bypassing domain resolution.
          maxAgeMs:
            type: integer
            minimum: 0
            maximum: 31536000000
            default: 7776000000
            description: Maximum age in milliseconds for cached styleguide data before a hard refresh. Defaults to 3 months. Set to 0 to always perform a hard refresh.
          colorScheme:
            type: string
            enum:
            - light
            - dark
            description: Optional browser color scheme to emulate for websites that respond to prefers-color-scheme. This value is part of the styleguide cache key.
          timeoutOpts:
            $ref: '#/components/schemas/ScrapeTimeout'
          zdr:
            type: string
            enum:
            - enabled
            - disabled
            default: disabled
            description: '`enabled` turns on zero data retention. Returns 403 `ZDR_NOT_ENABLED` unless your organization has ZDR.'
      security:
      - bearerAuth: []
      tags:
      - Web Extraction
      x-mint:
        content: <Badge color="blue">10 credits</Badge>
      parameters:
      - schema:
          type: string
          minLength: 3
          description: Domain name to extract styleguide from (e.g., 'example.com', 'google.com'). The domain will be automatically normalized and validated. You must provide either 'domain' or 'directUrl', but not both.
        required: false
        description: Domain name to extract styleguide from (e.g., 'example.com', 'google.com'). The domain will be automatically normalized and validated. You must provide either 'domain' or 'directUrl', but not both.
        name: domain
        in: query
      - schema:
          type: string
          format: uri
          description: Exact URL to inspect. Provide either `domain` or `directUrl`, not both.
        required: false
        description: Exact URL to inspect. Provide either `domain` or `directUrl`, not both.
        name: directUrl
        in: query
      - schema:
          type:
          - integer
          - 'null'
          default: 7776000000
          description: Maximum age of cached brand data in ms. Defaults to 3 months; clamped to 0–1 year. `0` refreshes.
        required: false
        description: Maximum age of cached brand data in ms. Defaults to 3 months; clamped to 0–1 year. `0` refreshes.
        name: maxAgeMs
        in: query
      - schema:
          $ref: '#/components/schemas/ScrapeTimeout'
        required: false
        description: Request deadline and what to return when it passes.
        style: deepObject
        explode: true
        name: timeoutOpts
        in: query
      - schema:
          type: string
          enum:
          - light
          - dark
          description: Optional browser color scheme to emulate for websites that respond to prefers-color-scheme. This value is part of the styleguide cache key.
        required: false
        description: Optional browser color scheme to emulate for websites that respond to prefers-color-scheme. This value is part of the styleguide cache key.
        name: colorScheme
        in: query
      - schema:
          type: string
          enum:
          - enabled
          - disabled
          default: disabled
          description: '`enabled` turns on zero data retention. Returns 403 `ZDR_NOT_ENABLED` unless your organization has ZDR.'
        required: false
        description: '`enabled` turns on zero data retention. Returns 403 `ZDR_NOT_ENABLED` unless your organization has ZDR.'
        name: zdr
        in: query
      - $ref: '#/components/parameters/RequestTags'
      responses:
        '200':
          description: Successful response
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
            X-Context-ZDR:
              description: Present with the value true when zero data retention was requested and honored.
              schema:
                type: string
                enum:
                - 'true'
          content:
            application/json:
              schema:
                type: object
                properties:
                  finalDOMState:
                    type: string
                    enum:
                    - loaded
                    - still-loading
                    description: '`loaded`, or `still-loading` when capture ended before the page finished loading.'
                  status:
                    type: string
                    description: Always `ok` on success.
                  domain:
                    type: string
                    description: The normalized domain that was processed
                  styleguide:
                    type: object
                    properties:
                      mode:
                        type: string
                        enum:
                        - light
                        - dark
                        description: The primary color mode of the website design
                      colors:
                        type: object
                        properties:
                          accent:
                            type: string
                            description: Accent color (hex format)
                          background:
                            type: string
                            description: Background color (hex format)
                          text:
                            type: string
                            description: Text color (hex format)
                        required:
                        - accent
                        - background
                        - text
                        description: Primary colors used on the website
                      typography:
                        type: object
                        properties:
                          headings:
                            type: object
                            properties:
                              h1:
                                type: object
                                properties:
                                  fontFamily:
                                    type: string
                                    description: First font in the stack.
                                  fontFallbacks:
                                    type: array
                                    items:
                                      type: string
                                    description: Full ordered font list from resolved computed font-family
                                  fontSize:
                                    type: string
                                  fontWeight:
                                    type: number
                                  lineHeight:
                                    type: string
                                  letterSpacing:
                                    type: string
                                required:
                                - fontFamily
                                - fontFallbacks
                                - fontSize
                                - fontWeight
                                - lineHeight
                                - letterSpacing
                              h2:
                                type: object
                                properties:
                                  fontFamily:
                                    type: string
                                    description: First font in the stack.
                                  fontFallbacks:
                                    type: array
                                    items:
                                      type: string
                                    description: Full ordered font list from resolved computed font-family
                                  fontSize:
                                    type: string
                                  fontWeight:
                                    type: number
                                  lineHeight:
                                    type: string
                                  letterSpacing:
                                    type: string
                                required:
                                - fontFamily
                                - fontFallbacks
                                - fontSize
                                - fontWeight
                                - lineHeight
                                - letterSpacing
                              h3:
                                type: object
                                properties:
                                  fontFamily:
                                    type: string
                                    description: First font in the stack.
                                  fontFallbacks:
                                    type: array
                                    items:
                                      type: string
                                    description: Full ordered font list from resolved computed font-family
                                  fontSize:
                                    type: string
                                  fontWeight:
                                    type: number
                                  lineHeight:
                                    type: string
                                  letterSpacing:
                                    type: string
                                required:
                                - fontFamily
                                - fontFallbacks
                                - fontSize
                                - fontWeight
                                - lineHeight
                                - letterSpacing
                              h4:
                                type: object
                                properties:
                                  fontFamily:
                                    type: string
                                    description: First font in the stack.
                                  fontFallbacks:
                                    type: array
                                    items:
                                      type: string
                                    description: Full ordered font list from resolved computed font-family
                                  fontSize:
                                    type: string
                                  fontWeight:
                                    type: number
                                  lineHeight:
                                    type: string
                                  letterSpacing:
                                    type: string
                                required:
                                - fontFamily
                                - fontFallbacks
                                - fontSize
                                - fontWeight
                                - lineHeight
                                - letterSpacing
                            description: Heading styles
                          p:
                            type: object
                            properties:
                              fontFamily:
                                type: string
                                description: First font in the stack.
                              fontFallbacks:
                                type: array
                                items:
                                  type: string
                                description: Full ordered font list from resolved computed font-family
                              fontSize:
                                type: string
                              fontWeight:
                                type: number
                              lineHeight:
                                type: string
                              letterSpacing:
                                type: string
                            required:
                            - fontFamily
                            - fontFallbacks
                            - fontSize
                            - fontWeight
                            - lineHeight
                            - letterSpacing
                        required:
                        - headings
                        description: Typography styles used on the website
                      elementSpacing:
                        type: object
                        properties:
                          xs:
                            type: string
                          sm:
                            type: string
                          md:
                            type: string
                          lg:
                            type: string
                          xl:
                            type: string
                        required:
                        - xs
                        - sm
                        - md
                        - lg
                        - xl
                        description: Spacing system used on the website
                      shadows:
                        type: object
                        properties:
                          sm:
                            type: string
                          md:
                            type: string
                          lg:
                            type: string
                          xl:
                            type: string
                          inner:
                            type: string
                        required:
                        - sm
                        - md
                        - lg
                        - xl
                        - inner
                        description: Shadow styles used on the website
                      fontLinks:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            type:
                              type: string
                              enum:
                              - google
                              - custom
                            files:
                              type: object
                              additionalProperties:
                                type: string
                              description: Upright font files keyed by weight string (e.g. "400" for regular, "500", "700"). Values are absolute URLs.
                            category:
                              type: string
                              description: Google Fonts category when type is google (e.g. sans-serif, serif, monospace, display, handwriting). Omitted for custom fonts when unknown.
                            displayName:
                              type: string
                              description: 'Present when type is custom: human-readable name derived from the fontLinks key (strip build/hash suffixes, split camelCase / PascalCase, normalize separators). Google entries omit this.'
                          required:
                          - type
                          - files
                        description: Font assets keyed by family name as it appears in fontFamily/fontFallbacks (non-generic names only). Clients match typography.fontFamily / fontWeight or button styles to pick a file URL from files.
                      components:
                        type: object
                        properties:
                          button:
                            type: object
                            properties:
                              primary:
                                type: object
                                properties:
                                  backgroundColor:
                                    type: string
                                  color:
                                    type: string
                                  borderColor:
                                    type: string
                                    description: 'Border color as CSS hex (#RRGGBB or #RRGGBBAA when computed border-color has alpha)'
                                  borderRadius:
                                    type: string
                                  borderWidth:
                                    type: string
                                  borderStyle:
                                    type: string
                                  padding:
                                    type: string
                                  minWidth:
                                    type: string
                                    description: Minimum width (usually px).
                                  minHeight:
                                    type: string
                                    description: Sampled minimum height of the button box (typically px)
                                  fontSize:
                                    type: string
                                  fontWeight:
                                    type: number
                                  fontFamily:
                                    type: string
                                    description: Primary button typeface (first in fontFallbacks)
                                  fontFallbacks:
                                    type: array
                                    items:
                                      type: string
                                    description: Full ordered font list from computed font-family
                                  textDecoration:
                                    type: string
                                  textDecorationColor:
                                    type: string
                                    description: Hex color of the underline when it differs from the text color
                                  boxShadow:
                                    type: string
                                    description: Computed box-shadow (comma-separated layers when present)
                                  css:
                                    type: string
                                    description: Ready-to-use CSS declaration block for this component style
                                required:
                                - backgroundColor
                                - color
                                - borderColor
                                - borderRadius
                                - borderWidth
                                - borderStyle
                                - padding
                                - minWidth
                                - minHeight
                                - fontSize
                                - fontWeight
                                - textDecoration
                                - boxShadow
                                - css
                              secondary:
                                type: object
                                properties:
                                  backgroundColor:
                                    type: string
                                  color:
                                    type: string
                                  borderColor:
                                    type: string
                                    description: 'Border color as CSS hex (#RRGGBB or #RRGGBBAA when computed border-color has alpha)'
                                  borderRadius:
                                    type: string
                                  borderWidth:
                                    type: string
                                  borderStyle:
                                    type: string
                                  padding:
                                    type: string
                                  minWidth:
                                    type: string
                                    description: Minimum width (usually px).
                                  minHeight:
                                    type: string
                                    description: Sampled minimum height of the button box (typically px)
                                  fontSize:
                                    type: string
                                  fontWeight:
                                    type: number
                                  fontFamily:
                                    type: string
                                    description: Primary button typeface (first in fontFallbacks)
                                  fontFallbacks:
                                    type: array
                                    items:
                                      type: string
                                    description: Full ordered font list from computed font-family
                                  textDecoration:
                                    type: string
                                  textDecorationColor:
                                    type: string
                                    description: Hex color of the underline when it differs from the text color
                                  boxShadow:
                                    type: string
                                    description: Computed box-shadow (comma-separated layers when present)
                                  css:
                                    type: string
                                    description: Ready-to-use CSS declaration block for this component style
                                required:
                                - backgroundColor
                                - color
                                - borderColor
                                - borderRadius
                                - borderWidth
                                - borderStyle
