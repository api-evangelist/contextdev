          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the response, e.g., 'ok'
                  domain:
                    type: string
                    description: The domain that was analyzed
                  urls_analyzed:
                    type: array
                    description: List of URLs that were analyzed
