          \ // This is the default and can be omitted\n});\n\nconst response = await client.batch.getResults('batch_9f2c8a');\n\
          \nconsole.log(response.data);"
      - lang: Python
        source: "import os\nfrom context.dev import ContextDev\n\nclient = ContextDev(\n    api_key=os.environ.get(\"CONTEXT_DEV_API_KEY\"\
          ),  # This is the default and can be omitted\n)\nresponse = client.batch.get_results(\n    batch_id=\"batch_9f2c8a\"\
          ,\n)\nprint(response.data)"
      - lang: Go
        source: "package main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n\n\t\"github.com/context-dot-dev/context-go-sdk\"\n\t\
          \"github.com/context-dot-dev/context-go-sdk/option\"\n)\n\nfunc main() {\n\tclient := contextdev.NewClient(\n\t\t\
          option.WithAPIKey(\"My API Key\"),\n\t)\n\tresponse, err := client.Batch.GetResults(\n\t\tcontext.TODO(),\n\t\t\"\
          batch_9f2c8a\",\n\t\tcontextdev.BatchGetResultsParams{},\n\t)\n\tif err != nil {\n\t\tpanic(err.Error())\n\t}\n\t\
          fmt.Printf(\"%+v\\n\", response.Data)\n}\n"
      - lang: Ruby
        source: 'require "context_dev"


          context_dev = ContextDev::Client.new(api_key: "My API Key")


          response = context_dev.batch.get_results("batch_9f2c8a")


          puts(response)'
      - lang: PHP
        source: "<?php\n\nrequire_once dirname(__DIR__) . '/vendor/autoload.php';\n\nuse ContextDev\\Client;\nuse ContextDev\\\
          Core\\Exceptions\\APIException;\n\n$client = new Client(apiKey: getenv('CONTEXT_DEV_API_KEY') ?: 'My API Key');\n\
          \ntry {\n  $response = $client->batch->getResults(\n    'batch_9f2c8a', cursor: 'cursor', limit: 1\n  );\n\n  var_dump($response);\n\
          } catch (APIException $e) {\n  echo $e->getMessage();\n}"
      - lang: CLI
        source: "context-dev batch get-results \\\n  --api-key 'My API Key' \\\n  --batch-id batch_9f2c8a"
security: []
components:
  headers:
    RateLimitLimit:
      description: Maximum requests allowed in the current fixed one-minute window. Returned when the authenticated API key
        has a per-minute rate limit.
      schema:
        type: integer
        minimum: 1
    RateLimitRemaining:
      description: Requests remaining in the current fixed one-minute window. Returned when the authenticated API key has
        a per-minute rate limit.
      schema:
        type: integer
        minimum: 0
    RateLimitReset:
      description: Unix timestamp in seconds when the current rate-limit window resets. Returned when the authenticated API
        key has a per-minute rate limit.
      schema:
        type: integer
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
    Unauthorized:
      description: Unauthorized
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Batch:
      type: object
      properties:
        id:
          type: string
          example: batch_9f2c8a
          description: Batch ID used to retrieve or cancel the job.
        status:
          type: string
          enum:
          - queued
          - running
          - cancelling
          - completed
          - cancelled
          - failed
          description: Current state. `completed`, `cancelled`, and `failed` are final.
        mode:
          type: string
          enum:
          - scrape
          - crawl
          description: How pages were selected. Matches `input.mode` on the submit request.
        format:
          type: string
          enum:
          - markdown
          - html
          description: What each page is returned as. Matches `input.data.format` on the submit request.
        tags:
          type: array
          items:
            type: string
          description: Tags stored on the batch at submission.
          example:
          - docs
        crawl:
          $ref: '#/components/schemas/BatchNullableCrawlControls'
        input:
          $ref: '#/components/schemas/BatchIntake'
        progress:
          type: object
          properties:
            succeeded:
              type: integer
              example: 18091
              description: Pages scraped successfully.
            failed:
              type: integer
              example: 311
              description: Pages that could not be scraped.
            pending:
              type: integer
              example: 6415
              description: Reserved pages not yet attempted. A cancelled batch keeps reporting the URLs it never reached;
                a crawl whose `input.reserved_is_ceiling` is true reports 0 once final, because its unspent budget was never
                real pages.
          required:
          - succeeded
          - failed
          - pending
          description: Pages attempted so far. Use `status` to check completion.
        credits:
          type: object
          properties:
            reserved:
              type: integer
              example: 24817
              description: Credits debited from your balance the moment the batch was accepted. This is a charge, not a forecast
                — the whole amount leaves the balance up front.
            refunded:
              type: integer
              example: 6726
              description: Credits returned for pages that did not succeed. Stays 0 until the batch reaches a final status,
                then settles in one movement.
            ocr_charged:
              type: integer
              example: 42
              description: Credits charged for PDF pages recovered by OCR (pdf.ocr=true), 1 per recovered page, on top of
                `reserved`. Stays 0 until the batch settles.
            net:
              type: integer
              example: 18091
              description: '`reserved` minus `refunded` plus `ocr_charged` — what the batch has cost so far. Equal to `reserved`
                until the batch settles.'
          required:
          - reserved
          - refunded
          - ocr_charged
          - net
          description: What this batch has done to your credit balance.
        timing:
          type: object
          properties:
            created_at:
              type: string
              description: When the batch was created.
            started_at:
              type:
              - string
              - 'null'
              description: When processing started. Null while queued.
            completed_at:
              type:
              - string
              - 'null'
              description: When processing finished. Null while active.
          required:
          - created_at
          - started_at
          - completed_at
        page_errors:
          type: array
          items:
            $ref: '#/components/schemas/BatchPageErrorCount'
          description: Individual page failures grouped by error code, sorted by count. Unrelated to `failure`, which is the
            batch itself failing.
        failure:
          $ref: '#/components/schemas/BatchNullableFailure'
        results:
          type:
          - object
          - 'null'
          properties:
            expires_at:
              type: string
              description: When the download URLs expire.
            files:
              type: array
              items:
                type: object
                properties:
                  url:
                    type: string
                    description: Temporary URL for a gzipped NDJSON file.
                  items:
                    type: integer
                    description: Results in this file.
                  bytes:
                    type: integer
                    description: Compressed file size in bytes.
                required:
                - url
                - items
                - bytes
              description: Result files. Order is not guaranteed.
          required:
          - expires_at
          - files
          description: Download links, available once the batch reaches a final status and null before then. GET /batch/{batch_id}/results
            serves the same records as paginated JSON.
      required:
      - id
      - status
      - mode
      - format
      - tags
      - crawl
      - input
      - progress
      - credits
      - timing
      - page_errors
      - failure
      - results
      title: Batch
      description: An asynchronous web scraping job.
    BatchAccepted:
      type: object
      properties:
        id:
          type: string
          example: batch_9f2c8a
          description: Batch ID. Poll GET /batch/{batch_id} with it.
        status:
          type: string
          enum:
          - queued
          description: Always `queued`. An accepted batch has not started yet.
        mode:
          type: string
          enum:
          - scrape
          - crawl
          description: How pages will be selected.
        format:
          type: string
          enum:
          - markdown
          - html
          description: What each page will be returned as.
        tags:
          type: array
          items:
            type: string
          description: Tags stored on the batch.
          example:
          - docs
        crawl:
          $ref: '#/components/schemas/BatchNullableCrawlControls'
        input:
          $ref: '#/components/schemas/BatchIntake'
        credits:
          type: object
          properties:
            reserved:
              type: integer
              example: 24817
              description: Credits just debited from your balance. Whatever the batch does not spend is refunded when it settles.
          required:
          - reserved
          description: What accepting this batch cost.
        created_at:
          type: string
          description: When the batch was created.
        invalid_urls:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                description: Rejected URL.
              reason:
                type: string
                description: Why it was rejected.
                example: Must be a public http:// or https:// URL
            required:
            - url
            - reason
          description: Rejected URLs, up to 100. These are not charged.
        webhook_secret:
          type: string
          description: Signing secret for the completion webhook, returned only here and never again. Store it now; it is
            not repeated by GET /batch/{batch_id}.
      required:
      - id
      - status
      - mode
      - format
      - tags
      - crawl
      - input
      - credits
      - created_at
      - invalid_urls
      title: Accepted batch
    BatchCancelling:
      type: object
      properties:
        id:
          type: string
          example: batch_9f2c8a
          description: Batch ID.
        status:
          type: string
          enum:
          - cancelling
          description: Always `cancelling`. Work already in flight finishes; the batch reaches `cancelled` shortly after.
        mode:
          type: string
          enum:
          - scrape
          - crawl
          description: How pages were selected.
        format:
          type: string
          enum:
          - markdown
          - html
          description: What each page is returned as.
        tags:
          type: array
          items:
            type: string
          description: Tags stored on the batch at submission.
          example:
          - docs
        crawl:
          $ref: '#/components/schemas/BatchNullableCrawlControls'
        input:
          $ref: '#/components/schemas/BatchIntake'
        progress:
          type: object
          properties:
            succeeded:
              type: integer
              example: 4120
              description: Pages scraped successfully before the request landed.
            failed:
              type: integer
              example: 37
              description: Pages that could not be scraped before the request landed.
            pending:
              type: integer
              example: 20660
              description: Reserved pages that will now be skipped, and refunded when the batch settles.
          required:
          - succeeded
          - failed
          - pending
          description: How far the batch got before cancellation.
        credits:
          type: object
          properties:
            reserved:
              type: integer
              example: 24817
              description: Credits debited at submission. The unspent remainder is refunded once the batch settles — read
                `credits.refunded` from GET /batch/{batch_id} then.
          required:
          - reserved
          description: What this batch cost so far.
        timing:
          type: object
          properties:
            created_at:
              type: string
              description: When the batch was created.
            started_at:
              type:
              - string
              - 'null'
              description: When processing started. Null if it was cancelled while still queued.
          required:
          - created_at
          - started_at
          description: There is no finish time yet — the batch is still winding down.
        page_errors:
          type: array
          items:
            $ref: '#/components/schemas/BatchPageErrorCount'
          description: Page failures so far, grouped by error code and sorted by count.
      required:
      - id
      - status
      - mode
      - format
      - tags
      - crawl
      - input
      - progress
      - credits
      - timing
      - page_errors
      title: Cancelling batch
      description: Acknowledgement that cancellation was requested. The batch has not settled, so it carries no results, no
        failure, no refund and no finish time; poll GET /batch/{batch_id} for those.
    BatchCrawlControls:
      type: object
      properties:
        source:
          anyOf:
          - type: object
            properties:
              type:
                type: string
                enum:
                - start_url
              url:
                type: string
                example: https://example.com/docs
                description: Page the crawl started from.
            required:
            - type
            - url
            title: Start URL
            description: The crawl discovered pages by following links from one URL.
          - type: object
            properties:
              type:
                type: string
                enum:
                - sitemap
              domain:
                type: string
                example: example.com
                description: Domain whose sitemap supplied the pages.
            required:
            - type
            - domain
            title: Sitemap
            description: The crawl scraped the pages listed in the domain's sitemap.
          description: Where the crawl started.
        max_pages:
          type: integer
          example: 500
          description: The `maxUrls` submitted with the crawl. A sitemap crawl scrapes only the URLs its sitemap actually
            lists, up to this many, so `input.reserved` is often lower.
        max_depth:
          type:
          - integer
          - 'null'
          example: 0
          description: Link depth limit. Always 0 for a sitemap crawl, which never follows links off its URLs; null when a
            `start_url` crawl set no limit.
        follow_subdomains:
          type: boolean
          description: Whether links to subdomains were followed. Always false for a sitemap crawl.
        url_pattern:
          type:
          - string
          - 'null'
          example: ^https://example\.com/docs/
          description: RE2 pattern URLs had to match to be crawled. Null when the crawl set none.
      required:
      - source
      - max_pages
      - max_depth
      - follow_subdomains
      - url_pattern
      x-stainless-model: batch.crawl_controls
      title: Crawl controls
      description: The crawl controls as submitted, so the limits requested can be compared against what the crawl reached.
    BatchDetail:
      type: object
      properties:
        invalid_urls:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                description: Rejected URL.
              reason:
                type: string
                description: Why it was rejected.
                example: Must be a public http:// or https:// URL
            required:
            - url
            - reason
          description: Rejected URLs, up to 100. These are not charged.
      required:
      - invalid_urls
      title: Batch detail
      description: What a single-batch read adds to the batch itself.
    BatchFailure:
      type: object
      properties:
        code:
          type: string
          example: stalled
          description: Why the batch itself stopped.
        message:
          type: string
          example: Batch stopped reporting progress and was finalized automatically
          description: Human-readable explanation.
      required:
      - code
      - message
      x-stainless-model: batch.failure
      description: A failure of the batch as a whole, distinct from the per-page failures in `page_errors`.
    BatchIntake:
      type: object
      properties:
        reserved:
          type: integer
          example: 24817
          description: Pages credits were reserved for. Everything else — progress, the refund, the completion percentage
            — is measured against this.
        reserved_is_ceiling:
          type: boolean
          example: false
          description: Whether `reserved` is an upper bound the batch may finish under. True only for a crawl that follows
            links, whose reachable page count is unknowable until it runs. False for a scrape and for a sitemap crawl, where
            `reserved` is an exact page count.
        submitted:
          type:
          - integer
          - 'null'
          example: 25000
          description: URLs in the list you sent, before validation and de-duplication. Null for a crawl, which is given a
            source rather than a list.
        duplicates:
          type: integer
          example: 183
          description: URLs dropped before reserving because another entry resolved to the same page. Non-zero for sitemap
            crawls too, whose sitemaps routinely list a page more than once.
        invalid:
          type:
          - integer
          - 'null'
          example: 0
          description: URLs from your list rejected as unusable; the same ones are itemised in `invalid_urls` at submission.
            Null for a crawl — a crawl that resolves no usable page is rejected outright with a 400 rather than accepted with
            an empty list.
      required:
      - reserved
      - reserved_is_ceiling
      - submitted
      - duplicates
      - invalid
      x-stainless-model: batch.intake
      description: What submission took in, and what it charged for.
    BatchNullableCrawlControls:
      anyOf:
      - allOf:
        - $ref: '#/components/schemas/BatchCrawlControls'
      - type: 'null'
      description: How the crawl was configured. Null for scrape batches.
    BatchNullableFailure:
      anyOf:
      - allOf:
        - $ref: '#/components/schemas/BatchFailure'
      - type: 'null'
      description: Why the batch as a whole stopped. Null unless `status` is `failed`. Individual pages that failed are counted
        in `page_errors` instead.
    BatchPageErrorCount:
      type: object
      properties:
        code:
          type: string
          example: WEBSITE_ACCESS_ERROR
          description: Error code for these failures.
        count:
          type: integer
          example: 204
          description: Pages that failed with this code.
      required:
      - code
      - count
      x-stainless-model: batch.page_error_count
      description: Page failures sharing one error code.
    BatchResultRecord:
      oneOf:
      - type: object
        properties:
          url:
            type: string
            example: https://example.com/products/anvil
            description: URL as submitted, or as discovered by the crawl.
          itemId:
            type: string
            example: sku-1
            description: Caller-supplied identifier echoed from submission.
          meta:
            type: object
            additionalProperties: {}
            description: Caller-supplied metadata echoed from submission.
          status:
            type: string
            enum:
            - ok
            description: The page was scraped.
          http_status:
            type:
            - integer
            - 'null'
            example: 200
            description: HTTP status of the final response, when known.
          final_url:
            type: string
            description: URL the content was read from, after redirects.
          markdown:
            type: string
            description: Page content as Markdown. Present on markdown batches.
          html:
            type: string
            description: Page HTML. Present on html batches, and on markdown batches submitted with `options.includeHTML`.
          metadata:
            $ref: '#/components/schemas/PageMetadata'
          ocr_pages:
            type: integer
            example: 3
            description: PDF pages of this document recovered by OCR (pdf.ocr=true). Each recovered page bills 1 credit on
              top of the page base credit; absent when no OCR ran.
        required:
        - url
        - status
        - http_status
        - final_url
        - metadata
        title: Scraped page
        description: A page the batch fetched successfully.
      - type: object
        properties:
          url:
            type: string
            example: https://example.com/products/anvil
            description: URL as submitted, or as discovered by the crawl.
          itemId:
            type: string
            example: sku-1
            description: Caller-supplied identifier echoed from submission.
          meta:
            type: object
            additionalProperties: {}
            description: Caller-supplied metadata echoed from submission.
          status:
            type: string
            enum:
            - error
            description: The page could not be scraped.
          error_code:
            type: string
            example: NOT_FOUND
            description: Why the page failed.
          message:
            type: string
            example: Page returned 404
            description: Human-readable failure detail.
        required:
        - url
        - status
        - error_code
        - message
        title: Failed page
        description: A page the batch could not fetch.
      discriminator:
        propertyName: status
      title: Batch result record
      description: One page outcome from a finished batch.
    BatchSubmitRequest:
      type: object
      properties:
        input:
          oneOf:
          - type: object
            properties:
              mode:
                type: string
                enum:
                - scrape
                description: Scrape the pages in `data.urls`.
              data:
