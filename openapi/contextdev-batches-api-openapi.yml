components:
  schemas:
    ScrapePdfOptions:
      type: object
      additionalProperties: false
      properties:
        startPage:
          type: integer
          minimum: 1
          description: First page to parse, starting at 1.
        endPage:
          type: integer
          minimum: 1
          description: Last page to parse. Must be at least `startPage`.
        ocr:
          type: string
          enum:
          - 'off'
          - auto
          default: 'off'
          description: Set `auto` to read scanned pages with OCR.
    ScrapeProfile:
      oneOf:
      - type: object
        title: Existing Profile
        additionalProperties: false
        properties:
          type:
            type: string
            const: existing
            description: Reuse a saved browser profile.
          profileId:
            type: string
            pattern: ^prof_[a-f0-9]{32}$
            description: The ID returned in profile.id by an earlier scrape.
        required:
        - type
        - profileId
      - type: object
        title: New Profile
        additionalProperties: false
        properties:
          type:
            type: string
            const: new
            description: Sign in and create a browser profile.
          identifier:
            type: string
            minLength: 1
            maxLength: 1024
            description: Username or email for the target website.
          password:
            type: string
            minLength: 1
            maxLength: 4096
            writeOnly: true
            description: Password used to sign in. It is never stored in the profile.
          description:
            type: string
            minLength: 1
            maxLength: 500
            description: Optional label shown when listing profiles with `GET /org/browser/profiles`.
        required:
        - type
        - identifier
        - password
      discriminator:
        propertyName: type
    RequestTags:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 50
      maxItems: 20
      description: Labels for filtering usage in the dashboard.
      example:
      - production
      - team-alpha
    ScrapeFormats:
      type: object
      additionalProperties: false
      properties:
        html:
          type: boolean
          default: false
          description: Rendered HTML.
        markdown:
          type: boolean
          default: false
          description: Page content as Markdown.
        screenshot:
          type: boolean
          default: false
          description: A screenshot of the page.
        images:
          type: boolean
          default: false
          description: Images found on the page.
        bytes:
          type: boolean
          default: false
          description: The original HTTP response body.
        parse:
          type: boolean
          default: false
          description: Fields extracted with custom rules or a prebuilt parser, returned as `parsed`.
        highlights:
          type: boolean
          default: false
          description: Markdown excerpts relevant to `highlightsParams.query`.
        json:
          type: boolean
          default: false
          description: An object matching `jsonParams.schema`, extracted from the page.
        product:
          type: boolean
          default: false
          description: Product details such as name, price, and availability.
      not:
        allOf:
        - not:
            required:
            - html
            properties:
              html:
                const: true
        - not:
            required:
            - markdown
            properties:
              markdown:
                const: true
        - not:
            required:
            - screenshot
            properties:
              screenshot:
                const: true
        - not:
            required:
            - images
            properties:
              images:
                const: true
        - not:
            required:
            - bytes
            properties:
              bytes:
                const: true
        - not:
            required:
            - parse
            properties:
              parse:
                const: true
        - not:
            required:
            - highlights
            properties:
              highlights:
                const: true
        - not:
            required:
            - json
            properties:
              json:
                const: true
        - not:
            required:
            - product
            properties:
              product:
                const: true
    ScrapeMarkdownParams:
      type: object
      additionalProperties: false
      properties:
        includeLinks:
          type: boolean
          default: true
          description: Keep link URLs in the Markdown. Set false to return link text without URLs.
        includeImages:
          type: boolean
          default: false
          description: Include images in the Markdown using image syntax with URLs and alt text.
        inlineImages:
          type: string
          enum:
          - placeholder
          - preserve
          description: 'How base64 images appear: `placeholder` (default) or `preserve`. Requires `includeImages`.'
      allOf:
      - if:
          required:
          - inlineImages
        then:
          required:
          - includeImages
          properties:
            includeImages:
              const: true
    ScrapeImage:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          pattern: ^(https?://|data:image/)
          description: Image URL, or a data URI for inline images.
        alt:
          type:
          - string
          - 'null'
          description: Alt text, if present.
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        classification:
          type: string
          enum:
          - photography
          - illustration
          - logo
          - wordmark
          - icon
          - pattern
          - graphic
          - other
        fileUrl:
          type: string
          format: uri
          pattern: ^https?://
          description: Hosted image URL, valid for 24 hours after capture. Requires `file` enrichment and ZDR disabled.
      required:
      - url
      - alt
    ScrapeSharedParams:
      type: object
      additionalProperties: false
      properties:
        profile:
          $ref: '#/components/schemas/ScrapeProfile'
          description: Create or reuse an authenticated browser profile. Requires a paid plan and an HTTPS target. Profiles persist session state, bypass shared caches, and cannot be combined with ZDR, custom headers, raw bytes, Google Maps, app store, Instagram, or G2 parsers. The emails, phone-numbers, and links parsers support profiles.
        country:
          type: string
          pattern: ^[A-Za-z]{2}$
          examples:
          - US
          description: Proxy country as a two-letter code, such as `US`. Case-insensitive.
        headers:
          type: object
          propertyNames:
            pattern: ^[!#$%&'*+.^_`|~0-9A-Za-z-]+$
            not:
              pattern: ^(?:[Hh][Oo][Ss][Tt]|[Cc][Oo][Nn][Tt][Ee][Nn][Tt]-[Ll][Ee][Nn][Gg][Tt][Hh]|[Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn]|[Kk][Ee][Ee][Pp]-[Aa][Ll][Ii][Vv][Ee]|[Pp][Rr][Oo][Xx][Yy]-[Aa][Uu][Tt][Hh][Ee][Nn][Tt][Ii][Cc][Aa][Tt][Ee]|[Pp][Rr][Oo][Xx][Yy]-[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn]|[Pp][Rr][Oo][Xx][Yy]-[Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn]|[Tt][Ee]|[Tt][Rr][Aa][Ii][Ll][Ee][Rr]|[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]-[Ee][Nn][Cc][Oo][Dd][Ii][Nn][Gg]|[Uu][Pp][Gg][Rr][Aa][Dd][Ee]|[Ee][Xx][Pp][Ee][Cc][Tt])$
          additionalProperties:
            type: string
            maxLength: 8192
            pattern: ^[^\r\n]*$
          description: HTTP headers to send to the target site. Requests with headers skip the cache.
          examples:
          - Accept-Language: en-US
        viewport:
          type: object
          additionalProperties: false
          properties:
            width:
              type: integer
              description: Browser viewport width in pixels.
              minimum: 240
              maximum: 7680
              default: 1440
            height:
              type: integer
              description: Browser viewport height in pixels.
              minimum: 240
              maximum: 4320
              default: 900
          description: Browser size in pixels. Omit for 1920 × 1080. When provided, missing dimensions default to 1440 × 900.
        theme:
          type: string
          enum:
          - light
          - dark
          description: Emulate a light or dark color scheme.
        dismissCookies:
          type: boolean
          default: true
          description: Accept cookie banners before actions and capture.
        dismissPopups:
          type: boolean
          default: false
          description: Close other popups before actions and capture.
        actions:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/ScrapeAction'
          description: Browser steps run in order before capture. Requires a paid plan. Skips the cache.
        waitFor:
          oneOf:
          - type: integer
            minimum: 0
            maximum: 30000
            title: Milliseconds
          - type: string
            pattern: \S
            maxLength: 2048
            title: CSS selector
          examples:
          - 500
          - '#content'
          description: Milliseconds, or a CSS selector to wait for, after actions. Defaults to 500 (2000 with frames or XML).
        settleAnimations:
          type: boolean
          description: Wait for CSS animations to finish before capture. Defaults to `true` when `screenshot` is requested.
        mainContentOnly:
          type: boolean
          default: false
          description: Keep only the main content. Doesn't affect `screenshot`, `bytes`, or `product`.
        includeSelectors:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            pattern: \S
            maxLength: 2048
          description: Keep only elements matching these CSS selectors.
        excludeSelectors:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            pattern: \S
            maxLength: 2048
          description: Remove elements matching these CSS selectors. Overrides `includeSelectors`.
        includeFrames:
          type: boolean
          default: false
          description: Include iframe content in HTML and text outputs. Screenshots always show visible frames.
        parsers:
          type: object
          additionalProperties: false
          description: Document parsing options.
          properties:
            pdf:
              $ref: '#/components/schemas/ScrapePdfOptions'
              description: PDF page range and OCR.
    ScrapeJsonParams:
      type: object
      additionalProperties: false
      properties:
        schema:
          type: object
          additionalProperties: true
          description: JSON Schema (not an example object) for a top-level object, up to 50 KB. Use optional or nullable fields for missing facts.
          example:
            type: object
            properties:
              name:
                type: string
                description: Product name.
              price:
                type: number
                description: Current price as a plain number.
              inStock:
                type: boolean
            required:
            - name
            additionalProperties: false
        instructions:
          type: string
          maxLength: 2000
          description: Extra guidance, such as which facts to prefer or how to read a field.
      required:
      - schema
    BatchCompletedWebhookPayload:
      type: object
      properties:
        event:
          type: string
          enum:
          - batch.completed
          description: Which final status the batch reached. Mirrors the `X-Context-Event` header.
        id:
          type: string
          example: evt_123
          description: Unique event ID. Mirrors the `X-Context-Id` header.
        created_at:
          type: string
          format: date-time
          example: '2026-07-09T18:00:12.000Z'
          description: When the batch reached its final status.
        data:
          type: object
          properties:
            batch:
              allOf:
              - $ref: '#/components/schemas/Batch'
              description: The batch in its final state, as in Retrieve a batch without `invalid_urls`. Result links expire 24 hours after the event, and replays resend the original links.
          required:
          - batch
      required:
      - event
      - id
      - created_at
      - data
      title: Batch completed webhook payload
      description: Payload sent when a batch completes.
    BatchCancelling:
      type: object
      properties:
        id:
          type: string
          example: batch_9f2c8a
          description: Batch ID.
        status:
          type: string
          enum:
          - cancelling
          description: Always `cancelling`. Work already in flight finishes; the batch reaches `cancelled` shortly after.
        mode:
          type: string
          enum:
          - scrape
          - crawl
          description: How pages were selected.
        tags:
          type: array
          items:
            type: string
          description: Tags stored on the batch at submission.
          example:
          - docs
        crawl:
          $ref: '#/components/schemas/BatchNullableCrawlControls'
        input:
          $ref: '#/components/schemas/BatchIntake'
        progress:
          type: object
          properties:
            succeeded:
              type: integer
              example: 4120
              description: Pages scraped successfully before the request landed.
            failed:
              type: integer
              example: 37
              description: Pages that could not be scraped before the request landed.
            pending:
              type: integer
              example: 20660
              description: Pages that will be skipped.
          required:
          - succeeded
          - failed
          - pending
          description: How far the batch got before cancellation.
        credits:
          type: object
          properties:
            reserved:
              type: integer
              example: 24817
              description: Credits held at submission; unused credits are refunded when the batch settles.
          required:
          - reserved
          description: What this batch cost so far.
        timing:
          type: object
          properties:
            created_at:
              type: string
              description: When the batch was created.
            started_at:
              type:
              - string
              - 'null'
              description: When processing started. Null if it was cancelled while still queued.
          required:
          - created_at
          - started_at
          description: Batch timestamps.
        page_errors:
          type: array
          items:
            $ref: '#/components/schemas/BatchPageErrorCount'
          description: Page failures so far, grouped by error code and sorted by count.
        formats:
          $ref: '#/components/schemas/ScrapeFormats'
          example:
            html: true
            markdown: true
          description: Outputs requested for each page. Matches input.data.formats on submission.
      required:
      - id
      - status
      - mode
      - tags
      - crawl
      - input
      - progress
      - credits
      - timing
      - page_errors
      - formats
      title: Cancelling batch
      description: Acknowledgement that cancellation was requested. The batch has not settled, so it carries no results, no failure, no refund and no finish time; poll GET /batch/{batch_id} for those.
    Batch:
      type: object
      properties:
        id:
          type: string
          example: batch_9f2c8a
          description: Batch ID.
        status:
          type: string
          enum:
          - queued
          - running
          - cancelling
          - completed
          - cancelled
          - failed
          description: Current state. `completed`, `cancelled`, and `failed` are final.
        mode:
          type: string
          enum:
          - scrape
          - crawl
          description: '`scrape` (URL list) or `crawl`.'
        tags:
          type: array
          items:
            type: string
          description: Tags stored on the batch at submission.
          example:
          - docs
        crawl:
          $ref: '#/components/schemas/BatchNullableCrawlControls'
        input:
          $ref: '#/components/schemas/BatchIntake'
        progress:
          type: object
          properties:
            succeeded:
              type: integer
              example: 18091
              description: Pages scraped successfully.
            failed:
              type: integer
              example: 311
              description: Pages that could not be scraped.
            pending:
              type: integer
              example: 6415
              description: Accepted pages not yet attempted. Unused crawl capacity is excluded after completion.
          required:
          - succeeded
          - failed
          - pending
          description: Pages attempted so far. Use `status` to check completion.
        credits:
          type: object
          properties:
            reserved:
              type: integer
              example: 24817
              description: Credits held when the batch was accepted.
            refunded:
              type: integer
              example: 6726
              description: Credits returned for unsuccessful pages when the batch settles.
            ocr_charged:
              type: integer
              example: 42
              description: OCR usage charged when the batch settles.
            net:
              type: integer
              example: 18091
              description: '`reserved` minus `refunded` plus `ocr_charged`.'
          required:
          - reserved
          - refunded
          - ocr_charged
          - net
          description: Batch credit usage and settlement.
        timing:
          type: object
          properties:
            created_at:
              type: string
              description: When the batch was created.
            started_at:
              type:
              - string
              - 'null'
              description: When processing started. Null while queued.
            completed_at:
              type:
              - string
              - 'null'
              description: When processing finished. Null while active.
          required:
          - created_at
          - started_at
          - completed_at
        page_errors:
          type: array
          items:
            $ref: '#/components/schemas/BatchPageErrorCount'
          description: Individual page failures grouped by error code, sorted by count. Unrelated to `failure`, which is the batch itself failing.
        failure:
          $ref: '#/components/schemas/BatchNullableFailure'
        results:
          type:
          - object
          - 'null'
          properties:
            expires_at:
              type: string
              description: When these links expire (24 hours after this response).
            files:
              type: array
              items:
                type: object
                properties:
                  url:
                    type: string
                    description: Temporary URL for a gzipped NDJSON file.
                  items:
                    type: integer
                    description: Results in this file.
                  bytes:
                    type: integer
                    description: Compressed file size in bytes.
                required:
                - url
                - items
                - bytes
              description: Result files. Order is not guaranteed.
          required:
          - expires_at
          - files
          description: Result download links; null until the batch finishes. Files are deleted 180 days after the batch finishes.
        formats:
          $ref: '#/components/schemas/ScrapeFormats'
          example:
            html: true
            markdown: true
          description: Outputs requested for each page. Matches input.data.formats on submission.
      required:
      - id
      - status
      - mode
      - tags
      - crawl
      - input
      - progress
      - credits
      - timing
      - page_errors
      - failure
      - results
      - formats
      title: Batch
      description: An asynchronous web scraping job.
    BatchUnifiedCrawlData:
      type: object
      additionalProperties: false
      properties:
        source:
          oneOf:
          - type: object
            properties:
              type:
                type: string
                enum:
                - start_url
                description: Start from one page.
              url:
                type: string
                minLength: 1
                description: Page where crawling begins. A URL without a scheme is read as https://.
                example: https://example.com/docs
              controls:
                type: object
                properties:
                  maxUrls:
                    type: integer
                    minimum: 1
                    maximum: 100000
                    default: 100
                    description: Maximum pages to fetch. Unused reserved credits are refunded. Maximum 100000.
                  maxDepth:
                    type: integer
                    minimum: 0
                    maximum: 50
                    description: Maximum link depth. Source pages are depth 0. No limit when omitted.
                  followSubdomains:
                    type: boolean
                    default: false
                    description: Follow links to subdomains.
                  regex:
                    type: string
                    maxLength: 256
                    description: RE2 pattern for URLs to include. The `start_url` itself is always included.
                    example: ^https://example\.com/docs/
                  excludeRegex:
                    type: string
                    maxLength: 256
                    description: RE2 pattern for URLs to exclude, even when they match `regex`. The `start_url` itself is always included.
                    example: /tag/|/author/
                default:
                  maxUrls: 100
                  followSubdomains: false
                additionalProperties: false
                description: Limits and filters for page discovery.
            required:
            - type
            - url
            additionalProperties: false
            description: Discover pages by following links from one URL.
            title: Start URL
          - type: object
            properties:
              type:
                type: string
                enum:
                - sitemap
                description: Scrape the URLs in the domain's sitemap.
              domain:
                type: string
                minLength: 3
                description: Domain whose sitemap lists the pages to scrape. A full URL is reduced to its domain.
                example: example.com
              controls:
                type: object
                properties:
                  maxUrls:
                    type: integer
                    minimum: 1
                    maximum: 100000
                    default: 100
                    description: Maximum pages to fetch. Unused reserved credits are refunded. Maximum 100000.
                  regex:
                    type: string
                    maxLength: 256
                    description: RE2 pattern; only sitemap URLs matching it are scraped.
                    example: ^https://example\.com/docs/
                  excludeRegex:
                    type: string
                    maxLength: 256
                    description: RE2 pattern; sitemap URLs matching it are not scraped, even when they match `regex`.
                    example: /tag/|/author/
                default:
                  maxUrls: 100
                additionalProperties: false
                description: Limits and filters for the sitemap URLs. A sitemap batch scrapes exactly those URLs and never follows links off them, so there is no crawl depth here.
            required:
            - type
            - domain
            additionalProperties: false
            description: Scrape the pages listed in a domain's sitemap. Links on those pages are not followed.
            title: Sitemap
          discriminator:
