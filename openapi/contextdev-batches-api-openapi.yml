      additionalProperties: false
    ScrapeImageParams:
      type: object
      additionalProperties: false
      properties:
        enrich:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum:
            - dimensions
            - classification
            - file
          description: 'Extra data per image: `dimensions`, `classification`, or a hosted `file` URL.'
        dedupe:
          type: string
          enum:
          - none
          - visual
          default: none
          description: Set `visual` to drop visual duplicates, keeping the largest copy.
    BatchSubmitRequest:
      type: object
      properties:
        input:
          oneOf:
          - type: object
            properties:
              mode:
                type: string
                enum:
                - scrape
                description: Scrape the pages in `data.urls`.
              data:
                $ref: '#/components/schemas/BatchUnifiedScrapeData'
            required:
            - mode
            - data
            additionalProperties: false
            title: Scrape
            description: Scrape a list of up to 100,000 URLs.
          - type: object
            properties:
              mode:
                type: string
                enum:
                - crawl
                description: Discover and scrape pages from `data.source`.
              data:
                $ref: '#/components/schemas/BatchUnifiedCrawlData'
            required:
            - mode
            - data
            additionalProperties: false
            title: Crawl
            description: Crawl pages starting from a URL or from a domain's sitemap.
          discriminator:
            propertyName: mode
          title: Batch input
          description: Choose a URL list or a site crawl.
        webhookUrl:
          type: string
          format: uri
          description: Legacy URL notified when the batch finishes. Preserves one best-effort attempt. Cannot be combined with webhook.
        webhook:
          type: object
          properties:
            url:
              type: string
              format: uri
              description: Public HTTP(S) URL that receives batch completion, failure, or cancellation events.
            retry:
              $ref: '#/components/schemas/WebhookRetry'
          required:
          - url
          additionalProperties: false
          description: Where to send the batch's final-status event. Omit `retry` for one attempt; `{}` uses the default retry schedule.
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          maxItems: 20
          description: Tags stored on the batch. Filter the batch list by them later.
          example:
          - docs
          - competitor
      required:
      - input
      additionalProperties: false
      title: Submit batch request
      description: Create an asynchronous scraping job.
    BatchFailure:
      type: object
      properties:
        code:
          type: string
          example: stalled
          description: Why the batch itself stopped.
        message:
          type: string
          example: Batch stopped reporting progress and was finalized automatically
          description: Human-readable explanation.
      required:
      - code
      - message
      x-stainless-model: batch.failure
      description: A failure of the batch as a whole, distinct from the per-page failures in `page_errors`.
  headers:
    RateLimitLimit:
      description: Maximum request units per minute, or maximum concurrent requests when X-RateLimit-Mode is concurrency.
      schema:
        type: integer
        minimum: 1
    RateLimitMode:
      description: Set to concurrency when these headers report concurrent requests. When a per-minute limit also applies, its rejections report per-minute headers without this header. New Free accounts have 2 concurrent requests and 10 requests per minute; paid plans have no per-minute limit by default. Existing and custom allowances can differ.
      schema:
        type: string
        enum:
        - concurrency
    RateLimitRemaining:
      description: Request units remaining in the current minute, or concurrent requests still available when X-RateLimit-Mode is concurrency.
      schema:
        type: integer
        minimum: 0
    RequestId:
      description: Unique ID of this request; also `request_id` in JSON bodies.
      schema:
        type: string
        format: uuid
    RateLimitReset:
      description: Unix timestamp in seconds when the per-minute rate limit resets. Omitted for concurrency limits.
      schema:
        type: integer
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        X-RateLimit-Mode:
          $ref: '#/components/headers/RateLimitMode'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        X-RateLimit-Mode:
          $ref: '#/components/headers/RateLimitMode'
    RateLimited:
      description: Rate limit exceeded. Organization concurrency rejections include structured error_data and subscription settings; follow Retry-After before retrying.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        X-RateLimit-Mode:
          $ref: '#/components/headers/RateLimitMode'
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
            maximum: 60
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: Human-readable error message.
              error_code:
                type: string
                enum:
                - RATE_LIMITED
                description: Error code indicating the rate limit was exceeded
              key_metadata:
                $ref: '#/components/schemas/KeyMetadata'
              error_data:
                $ref: '#/components/schemas/ConcurrencyErrorData'
              request_id:
                $ref: '#/components/schemas/RequestId'
            required:
            - request_id
            - message
            - error_code
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        X-RateLimit-Mode:
          $ref: '#/components/headers/RateLimitMode'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Send `Authorization: Bearer <API_KEY>`. Keys have full access unless restricted to scopes.'
