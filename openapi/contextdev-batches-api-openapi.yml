openapi: 3.2.0
info:
  title: Context.dev Batches API
  description: Scrape, crawl, search, and monitor websites, and retrieve brand, people, and news data.
  version: 1.0.0
servers:
- url: https://api.context.dev/v1
tags:
- name: Batches
  description: Scrape many pages or crawl a site asynchronously.
paths:
  /batch/submit:
    post:
      summary: Submit a batch
      description: Scrape up to 100,000 URLs, or crawl a site, asynchronously using the same formats and scrape parameters as POST /web/scrape. Choose Markdown, HTML, screenshots, images, bytes, parsed fields, products, highlights, and JSON. Poll the batch ID or receive a webhook when it finishes.
      operationId: submitBatch
      security:
      - bearerAuth: []
      tags:
      - Batches
      x-mint:
        content: <Badge color="blue">From 1 credit per page</Badge>
      parameters:
      - schema:
          type: string
          maxLength: 200
          description: Unique key per submission. Retrying with the same key and body returns the original batch; a different body returns `409`.
        required: false
        description: Unique key per submission. Retrying with the same key and body returns the original batch; a different body returns `409`.
        name: Idempotency-Key
        in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchSubmitRequest'
            examples:
              scrapeAnything:
                summary: Scrape URLs as Markdown and HTML
                value:
                  input:
                    mode: scrape
                    data:
                      urls:
                      - url: https://example.com/products/anvil
                        itemId: sku-1
                        meta:
                          category: tools
                      - url: https://example.com/products/hammer
                        itemId: sku-2
                      formats:
                        markdown: true
                        html: true
                      sharedParams:
                        mainContentOnly: true
              scrapeScreenshots:
                summary: Capture screenshots and images
                value:
                  input:
                    mode: scrape
                    data:
                      urls:
                      - url: https://example.com
                      - url: https://example.com/pricing
                      formats:
                        screenshot: true
                        images: true
                      screenshotParams:
                        area: fullPage
                        format: png
              scrapeJson:
                summary: Extract structured JSON from each URL
                value:
                  input:
                    mode: scrape
                    data:
                      urls:
                      - url: https://example.com/products/anvil
                      formats:
                        json: true
                      jsonParams:
                        schema:
                          type: object
                          properties:
                            name:
                              type: string
                            price:
                              type:
                              - number
                              - 'null'
                          required:
                          - name
                          additionalProperties: false
              crawlAnything:
                summary: Crawl a site with multiple output formats
                value:
                  input:
                    mode: crawl
                    data:
                      source:
                        type: start_url
                        url: https://example.com/docs
                        controls:
                          maxUrls: 500
                          maxDepth: 3
                      formats:
                        markdown: true
                        html: true
                      sharedParams:
                        mainContentOnly: true
              crawlSitemapAnything:
                summary: Scrape sitemap pages with selected formats
                value:
                  input:
                    mode: crawl
                    data:
                      source:
                        type: sitemap
                        domain: example.com
                        controls:
                          maxUrls: 250
                      formats:
                        markdown: true
                        images: true
      responses:
        '202':
          description: Batch accepted. Read progress and results from `GET /batch/{batch_id}`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BatchAccepted'
                - type: object
                  properties:
                    key_metadata:
                      $ref: '#/components/schemas/KeyMetadata'
                      description: API key usage for this request.
                    request_id:
                      $ref: '#/components/schemas/RequestId'
                  required:
                  - request_id
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Authentication failed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Insufficient credits (`USAGE_EXCEEDED`); authentication is valid. Retry once funded. Legacy deployments may return 401.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Too many active batches (`BATCH_LIMIT_EXCEEDED`), or the key lacks `batches:write` (`INSUFFICIENT_PERMISSIONS`).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency-Key reused with a different body (error_code IDEMPOTENCY_KEY_CONFLICT).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Batch input could not be staged or queued.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /batch/list:
    get:
      summary: List batches
      description: List your batches, newest first, with optional filters.
      operationId: listBatches
      security:
      - bearerAuth: []
      tags:
      - Batches
      x-mint:
        content: <Badge color="blue">0 credits</Badge>
      parameters:
      - schema:
          type: boolean
          default: false
          description: Include batches submitted with Scrape Anything formats. Defaults to false.
        required: false
        description: Include batches submitted with Scrape Anything formats. Defaults to false.
        name: shouldIncludeUnified
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
          description: Batches per page. Defaults to 25.
        required: false
        description: Batches per page. Defaults to 25.
        name: limit
        in: query
      - schema:
          type: string
          description: Cursor from the previous page.
        required: false
        description: Cursor from the previous page.
        name: cursor
        in: query
      - schema:
          type: string
          enum:
          - queued
          - running
          - cancelling
          - completed
          - cancelled
          - failed
          description: Filter by status.
        required: false
        description: Filter by status.
        name: status
        in: query
      - schema:
          type: string
          maxLength: 200
          description: Free-text search term, matched against the batch id, crawl source (start URL or sitemap domain), and tags.
          example: batch_1a2b
        required: false
        description: Free-text search term, matched against the batch id, crawl source (start URL or sitemap domain), and tags.
        name: q
        in: query
      - schema:
          type: string
          enum:
          - exact
          - prefix
          description: '`prefix` for as-you-type prefix matching (default), `exact` for full-token matching.'
        required: false
        description: '`prefix` for as-you-type prefix matching (default), `exact` for full-token matching.'
        name: search_type
        in: query
      - schema:
          anyOf:
          - type: string
          - type: array
            items:
              type: string
          description: Tags to filter by (matches batches having any of them). Pass repeated `tags` params or one comma-separated list, e.g. `tags=docs,competitor`.
          example: docs,competitor
        required: false
        description: Tags to filter by (matches batches having any of them). Pass repeated `tags` params or one comma-separated list, e.g. `tags=docs,competitor`.
        name: tags
        in: query
      responses:
        '200':
          description: Your batches, newest first. Use `next_cursor` to page through the rest.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Batch'
                    description: Batches on this page.
                  has_more:
                    type: boolean
                    description: Whether another page is available.
                  next_cursor:
                    type:
                    - string
                    - 'null'
                    description: Cursor for the next page.
                  key_metadata:
                    $ref: '#/components/schemas/KeyMetadata'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
                required:
                - request_id
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: API key permissions or organization settings do not allow this request.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Search is temporarily unavailable (`SEARCH_UNAVAILABLE`). Retry or list without search filters.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /batch/{batch_id}:
    get:
      summary: Retrieve a batch
      description: Get batch progress and result download links. Result files are deleted 180 days after the batch finishes.
      operationId: getBatch
      security:
      - bearerAuth: []
      tags:
      - Batches
      x-mint:
        content: <Badge color="blue">0 credits</Badge>
      parameters:
      - schema:
          type: string
          example: batch_9f2c8a
          description: Batch ID.
        required: true
        description: Batch ID.
        name: batch_id
        in: path
      responses:
        '200':
          description: Current state of the batch, with download links once it has finished.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Batch'
                - type: object
                  properties:
                    key_metadata:
                      $ref: '#/components/schemas/KeyMetadata'
                      description: API key usage for this request.
                    request_id:
                      $ref: '#/components/schemas/RequestId'
                  required:
                  - request_id
                - $ref: '#/components/schemas/BatchDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: API key permissions or organization settings do not allow this request.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      summary: Delete a batch
      description: Permanently delete a finished batch and its results. Its webhook deliveries can no longer be retried.
      operationId: deleteBatch
      security:
      - bearerAuth: []
      tags:
      - Batches
      x-mint:
        content: <Badge color="blue">0 credits</Badge>
      parameters:
      - schema:
          type: string
          example: batch_9f2c8a
          description: Batch ID.
        required: true
        description: Batch ID.
        name: batch_id
        in: path
      responses:
        '200':
          description: Batch and its stored results are permanently deleted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: ID of the deleted batch.
                  deleted:
                    type: boolean
                    description: Always true on success.
                  key_metadata:
                    $ref: '#/components/schemas/KeyMetadata'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
                required:
                - request_id
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: API key permissions or organization settings do not allow this request.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Batch is active or still settling (`BATCH_NOT_COMPLETED`). Cancel it, wait for a final status, then retry.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /batch/{batch_id}/results:
    get:
      summary: List batch results
      description: Page through a finished batch’s results as JSON. Each record contains result with the same outputs and per-format errors as POST /web/scrape. Results remain available for 180 days.
      operationId: getBatchResults
      security:
      - bearerAuth: []
      tags:
      - Batches
      x-mint:
        content: <Badge color="blue">0 credits</Badge>
      parameters:
      - schema:
          type: string
          example: batch_9f2c8a
          description: Batch ID.
        required: true
        description: Batch ID.
        name: batch_id
        in: path
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
          description: Records per page. Defaults to 25. A page can close early so its payload stays under ~8 MB; rely on next_cursor rather than counting records.
        required: false
        description: Records per page. Defaults to 25. A page can close early so its payload stays under ~8 MB; rely on next_cursor rather than counting records.
        name: limit
        in: query
      - schema:
          type: string
          pattern: ^\d+:\d+$
          description: next_cursor from the previous page.
        required: false
        description: next_cursor from the previous page.
        name: cursor
        in: query
      responses:
        '200':
          description: One page of result records. Keep paging with `next_cursor` while `has_more` is true.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BatchResultRecord'
                    description: Result records on this page.
                  has_more:
                    type: boolean
                    description: Whether another page is available.
                  next_cursor:
                    type:
                    - string
                    - 'null'
                    description: Cursor for the next page.
                  key_metadata:
                    $ref: '#/components/schemas/KeyMetadata'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
                required:
                - request_id
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: API key permissions or organization settings do not allow this request.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Batch has not finished yet (error_code BATCH_NOT_COMPLETED).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /batch/{batch_id}/cancel:
    post:
      summary: Cancel a batch
      description: Stop a batch from starting new pages. Pages already in progress finish before the batch becomes cancelled.
      operationId: cancelBatch
      security:
      - bearerAuth: []
      tags:
      - Batches
      x-mint:
        content: <Badge color="blue">0 credits</Badge>
      parameters:
      - schema:
          type: string
          example: batch_9f2c8a
          description: Batch ID.
        required: true
        description: Batch ID.
        name: batch_id
        in: path
      responses:
        '202':
          description: Cancellation started. Poll `GET /batch/{batch_id}` until the batch settles.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BatchCancelling'
                - type: object
                  properties:
                    key_metadata:
                      $ref: '#/components/schemas/KeyMetadata'
                      description: API key usage for this request.
                    request_id:
                      $ref: '#/components/schemas/RequestId'
                  required:
                  - request_id
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: API key permissions or organization settings do not allow this request.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Batch already finished (`BATCH_NOT_CANCELLABLE`).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
webhooks:
  batchCompleted:
    post:
      summary: Batch completed
      description: Sent when a batch completes. Return any 2xx response to acknowledge delivery. Slack incoming webhook destinations receive a formatted Slack message instead of this event envelope.
      operationId: batchCompleted
      tags:
      - Batches
      security: []
      parameters:
      - schema:
          type: string
          example: Context.dev-Webhooks/1.0
        required: true
        description: Identifies the Context.dev webhook sender.
        name: User-Agent
        in: header
      - schema:
          type: string
          enum:
          - batch.completed
        required: true
        description: Which final status the batch reached. Matches the `event` field in the request body.
        name: X-Context-Event
        in: header
      - schema:
          type: string
          example: evt_123
        required: true
        description: Unique event ID. Matches the top-level `id` field in the request body.
        name: X-Context-Id
        in: header
      - schema:
          type: string
          example: whd_0123456789abcdef0123456789abcdef
        required: false
        description: Delivery ID for status checks and retries.
