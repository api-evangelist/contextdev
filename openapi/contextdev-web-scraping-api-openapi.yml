  /web/urls:
    get:
      summary: Map URLs
      description: Discover a site's URLs, with page titles, descriptions, keywords, and language when available. Metadata can be missing on newly discovered URLs.
      security:
      - bearerAuth: []
      tags:
      - Web Scraping
      x-mint:
        content: <Badge color="blue">From 1 credit</Badge>
      parameters:
      - schema:
          type: string
          minLength: 3
          description: Domain to map, e.g. `stripe.com`.
          example: stripe.com
        required: true
        description: Domain to map, e.g. `stripe.com`.
        name: domain
        in: query
      - schema:
          type: boolean
          default: false
          description: Include URLs on subdomains.
        required: false
        description: Include URLs on subdomains.
        name: includeSubdomains
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 100000
          default: 10000
          description: Maximum number of URLs to return.
        required: false
        description: Maximum number of URLs to return.
        name: maxLinks
        in: query
      - schema:
          type: string
          format: uri
          description: Fetch this sitemap instead of discovering sitemaps. Must belong to the domain or a subdomain.
        required: false
        description: Fetch this sitemap instead of discovering sitemaps. Must belong to the domain or a subdomain.
        name: sitemapUrl
        in: query
      - schema:
          type: string
          maxLength: 256
          description: Optional RE2-compatible regex pattern. Only URLs matching this pattern are returned and counted against maxLinks.
          example: ^https?://[^/]+/blog/
        required: false
        description: Optional RE2-compatible regex pattern. Only URLs matching this pattern are returned and counted against maxLinks.
        name: urlRegex
        in: query
      - schema:
          type: string
          maxLength: 256
          description: Optional RE2-compatible regex pattern. URLs matching this pattern are not returned, even when they match urlRegex.
          example: /tag/|/author/
        required: false
        description: Optional RE2-compatible regex pattern. URLs matching this pattern are not returned, even when they match urlRegex.
        name: excludeUrlRegex
        in: query
      - schema:
          type: string
          minLength: 2
          maxLength: 200
          description: Filter URLs by a topic or phrase, most relevant first.
          example: help center and troubleshooting articles
        required: false
        description: Filter URLs by a topic or phrase, most relevant first.
        name: search
        in: query
      - schema:
          type: object
          additionalProperties:
            type: string
            maxLength: 8192
            pattern: ^[^\r\n]*$
          description: HTTP headers for the target origin. Non-empty headers bypass caching.
        required: false
        description: HTTP headers for the target origin. Non-empty headers bypass caching.
        name: headers
        in: query
      - schema:
          $ref: '#/components/schemas/LenientPartialTimeout'
        required: false
        description: Request deadline and what to return when it passes.
        style: deepObject
        explode: true
        name: timeoutOpts
        in: query
      - schema:
          type: string
          enum:
          - enabled
          - disabled
          default: disabled
          description: '`enabled` turns on zero data retention. Returns 403 `ZDR_NOT_ENABLED` unless your organization has ZDR.'
        required: false
        description: '`enabled` turns on zero data retention. Returns 403 `ZDR_NOT_ENABLED` unless your organization has ZDR.'
        name: zdr
        in: query
      - $ref: '#/components/parameters/RequestTags'
      responses:
        '200':
          description: Discovered URLs with available page metadata
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
            X-Context-ZDR:
