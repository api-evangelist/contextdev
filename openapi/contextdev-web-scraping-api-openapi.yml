                      - mn
                      - mr
                      - ms
                      - ne
                      - nl
                      - 'no'
                      - or
                      - pa
                      - pl
                      - ps
                      - pt
                      - ro
                      - ru
                      - sk
                      - sl
                      - so
                      - sq
                      - sr
                      - sv
                      - sw
                      - ta
                      - te
                      - th
                      - tl
                      - tr
                      - uk
                      - ur
                      - uz
                      - vi
                      - yo
                      - zh
                    minItems: 1
                  default: all
                  description: 'Languages to return results in, as BCP 47 language codes such as `en` or `de`, or "all" for any language. Defaults to "all". Example: ["en", "de"].'
                queryFanout:
                  type: boolean
                  description: Currently has no effect.
                markdownOptions:
                  type:
                  - object
                  - 'null'
                  properties:
                    enabled:
                      type: boolean
                      default: false
                      description: Scrape each result to Markdown. Adds 1 credit per result with Markdown.
                    includeLinks:
                      type: boolean
                      default: true
                      description: Keep hyperlinks in the Markdown.
                    includeImages:
                      type: boolean
                      default: false
                      description: Emit image references in the Markdown.
                    shortenBase64Images:
                      type: boolean
                      default: true
                      description: Truncate inline base64 image payloads to keep responses small.
                    useMainContentOnly:
                      type: boolean
                      default: false
                      description: Strip nav, header, footer, and sidebar — keep only the primary article content.
                    pdf:
                      type: object
                      properties:
                        shouldParse:
                          type: boolean
                          default: true
                          description: Parse PDF URLs. When false, PDF results are skipped with WEBSITE_ACCESS_ERROR.
                        start:
                          type: integer
                          minimum: 1
                          description: First 1-based PDF page to parse.
                        end:
                          type: integer
                          minimum: 1
                          description: Last PDF page to parse (1-based, inclusive). Defaults to the final page. Must be >= start.
                      default:
                        shouldParse: true
                      additionalProperties: false
                      description: PDF handling. `start`/`end` limit parsing to an inclusive, 1-based page range.
                    includeFrames:
                      type: boolean
                      default: false
                      description: Render iframe contents into the Markdown.
                    maxAgeMs:
                      type:
                      - integer
                      - 'null'
                      minimum: 0
                      maximum: 31536000000
                      description: 'Maximum cache age in milliseconds for result page content. Defaults to 180 days (15552000000 ms) when Markdown is requested, or 365 days (31536000000 ms) when only highlights are requested. Explicit values override either default. Maximum: 365 days. Set to 0 to force a fresh scrape.'
                    waitForMs:
                      type:
                      - integer
                      - 'null'
                      minimum: 0
                      maximum: 30000
                      description: Extra wait after page load before rendering, in ms (0–30000). Useful for JS-heavy pages.
                    timeoutOpts:
                      $ref: '#/components/schemas/ScrapeTimeout'
                  additionalProperties: false
                  description: 'Inline Markdown scraping for each result. Set `enabled: true` to activate.'
                highlightsOptions:
                  type:
                  - object
                  - 'null'
                  properties:
                    enabled:
                      type: boolean
                      default: false
                      description: Return relevant passages for each result. Adds 1 credit per 10 results.
                    maxCharacters:
                      type: integer
                      minimum: 100
                      maximum: 20000
                      default: 4000
                      description: Maximum combined length of passages per result.
                  additionalProperties: false
                  description: Passages from each result page that are relevant to the query. Pages are read with the `markdownOptions` settings.
                descriptionMaxCharacters:
                  type:
                  - integer
                  - 'null'
                  minimum: 0
                  default: null
                  description: Maximum length of each result's `description`, in characters.
                timeoutOpts:
                  $ref: '#/components/schemas/PartialTimeout'
                zdr:
                  type: string
                  enum:
                  - enabled
                  - disabled
                  default: disabled
                  description: '`enabled` turns on zero data retention. Returns 403 `ZDR_NOT_ENABLED` unless your organization has ZDR.'
                tags:
                  $ref: '#/components/schemas/RequestTags'
              required:
              - query
              additionalProperties: false
            example:
              query: Stripe API authentication
              numResults: 10
      responses:
        '200':
          description: Search succeeded. Results are ordered by relevance.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
            X-Context-ZDR:
              description: Present with the value true when zero data retention was requested and honored.
              schema:
                type: string
                enum:
                - 'true'
          content:
            application/json:
              schema:
                type: object
                properties:
                  partial:
                    type: boolean
                    description: True when timeoutOpts.behavior=return-partial returned the usable results collected before the deadline. Partial collections are not cached as complete results.
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                          description: Canonical result URL.
                        title:
                          type: string
                          description: Page title.
                        description:
                          type: string
                          description: Snippet excerpt from the page. Empty string when the search provider does not supply a snippet.
                        relevance:
                          type: string
                          enum:
                          - high
                          - medium
                          - low
                          description: Relevance to the original query.
                        markdown:
                          type: object
                          properties:
                            finalDOMState:
                              type: string
                              enum:
                              - loaded
                              - still-loading
                              description: '`loaded`, or `still-loading` when capture ended before the page finished loading.'
                            markdown:
                              type:
                              - string
                              - 'null'
                              description: GFM Markdown of the page. Null unless markdownOptions.enabled is true and scraping succeeded.
                            code:
                              type: string
                              enum:
                              - SUCCESS
                              - NOT_REQUESTED
                              - TIMEOUT
                              - CONTENT_TOO_LARGE
                              - WEBSITE_ACCESS_ERROR
                              - WEBSITE_BLOCKED
                              - ERROR
                              description: Per-result scrape outcome. Inspect this before reading `markdown`.
                          required:
                          - markdown
                          - code
                          additionalProperties: false
                          description: Markdown scrape status and content for this result.
                        highlights:
                          type: object
                          properties:
                            highlights:
                              type:
                              - array
                              - 'null'
                              items:
                                type: string
                              description: Passages relevant to the query, in page order. Null unless highlightsOptions.enabled is true and the page was read.
                            code:
                              type: string
                              enum:
                              - SUCCESS
                              - NOT_REQUESTED
                              - TIMEOUT
                              - CONTENT_TOO_LARGE
                              - WEBSITE_ACCESS_ERROR
                              - WEBSITE_BLOCKED
                              - ERROR
                              description: Per-result highlights outcome. Inspect this before reading `highlights`.
                          required:
                          - highlights
                          - code
                          additionalProperties: false
                          description: Highlights status and passages for this result.
                      required:
                      - url
                      - title
                      - description
                      - relevance
                      - markdown
                      - highlights
                  query:
                    type: string
                    description: Echo of the original query (useful when fanout was enabled).
                  key_metadata:
                    $ref: '#/components/schemas/KeyMetadata'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
                  cache_metadata:
                    $ref: '#/components/schemas/CacheMetadata'
                required:
                - results
                - query
                - request_id
                - cache_metadata
        '400':
          description: Bad request - Invalid parameters
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message describing the issue
                  error_code:
                    type: string
                    enum:
                    - INPUT_VALIDATION_ERROR
                    description: Machine-readable error code.
                  key_metadata:
                    $ref: '#/components/schemas/KeyMetadata'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
                required:
                - message
                - error_code
                - request_id
        '401':
          description: Missing, invalid, or disabled API key.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Insufficient credits (`USAGE_EXCEEDED`); authentication is valid. Retry once funded. Legacy deployments may return 401.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: API key permissions or organization settings do not allow this request.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: Request timeout
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Timeout error message
                  error_code:
                    type: string
                    enum:
                    - REQUEST_TIMEOUT
                    description: Error code indicating request timeout
                  key_metadata:
                    $ref: '#/components/schemas/KeyMetadata'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
                required:
                - request_id
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Internal server error
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable error message.
                  error_code:
                    type: string
                    enum:
                    - INTERNAL_ERROR
                    description: Error code indicating internal server error
                  key_metadata:
                    $ref: '#/components/schemas/KeyMetadata'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
                required:
                - request_id
      operationId: postWebSearch
      x-operation-id-source: derived
components:
  schemas:
    ScrapePdfOptions:
      type: object
      additionalProperties: false
      properties:
        startPage:
          type: integer
          minimum: 1
          description: First page to parse, starting at 1.
        endPage:
          type: integer
          minimum: 1
          description: Last page to parse. Must be at least `startPage`.
        ocr:
          type: string
          enum:
          - 'off'
          - auto
          default: 'off'
          description: Set `auto` to read scanned pages with OCR.
    ScrapeProfile:
      oneOf:
      - type: object
        title: Existing Profile
        additionalProperties: false
        properties:
          type:
            type: string
            const: existing
            description: Reuse a saved browser profile.
          profileId:
            type: string
            pattern: ^prof_[a-f0-9]{32}$
            description: The ID returned in profile.id by an earlier scrape.
        required:
        - type
        - profileId
      - type: object
        title: New Profile
        additionalProperties: false
        properties:
          type:
            type: string
            const: new
            description: Sign in and create a browser profile.
          identifier:
            type: string
            minLength: 1
            maxLength: 1024
            description: Username or email for the target website.
          password:
            type: string
            minLength: 1
            maxLength: 4096
            writeOnly: true
            description: Password used to sign in. It is never stored in the profile.
          description:
            type: string
            minLength: 1
            maxLength: 500
            description: Optional label shown when listing profiles with `GET /org/browser/profiles`.
        required:
        - type
        - identifier
        - password
      discriminator:
        propertyName: type
    RequestTags:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 50
      maxItems: 20
      description: Labels for filtering usage in the dashboard.
      example:
      - production
      - team-alpha
    ScrapeRequest:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          pattern: ^https?://
          description: Public HTTP or HTTPS URL to scrape.
        formats:
          $ref: '#/components/schemas/ScrapeFormats'
          description: Outputs to return. Set at least one to `true`.
        markdownParams:
          $ref: '#/components/schemas/ScrapeMarkdownParams'
          description: Markdown options. Requires `formats.markdown`.
        screenshotParams:
          $ref: '#/components/schemas/ScrapeScreenshotParams'
          description: 'Screenshot options. Requires formats.screenshot: true.'
        imageParams:
          $ref: '#/components/schemas/ScrapeImageParams'
          description: 'Image options. Requires formats.images: true.'
        parseParams:
          $ref: '#/components/schemas/ScrapeParseParams'
          description: 'Requires `formats.parse: true`; required when it is set.'
        highlightsParams:
          $ref: '#/components/schemas/ScrapeHighlightsParams'
          description: 'Requires `formats.highlights: true`; required when it is set.'
        jsonParams:
          $ref: '#/components/schemas/ScrapeJsonParams'
          description: 'Requires `formats.json: true`; required when it is set.'
        productParams:
          $ref: '#/components/schemas/ScrapeProductParams'
          description: 'Product options. Requires formats.product: true.'
        sharedParams:
          $ref: '#/components/schemas/ScrapeSharedParams'
          description: Browser and content settings shared by all outputs.
        maxAgeMs:
          type: integer
          minimum: 0
          maximum: 31536000000
          default: 259200000
          description: 'Maximum age of a cached output, in milliseconds. `0` fetches fresh. Defaults to 3 days (259200000 ms). Maximum: 1 year (31536000000 ms).'
        zdr:
          type: string
          enum:
          - enabled
          - disabled
          default: disabled
          description: '`enabled` turns on zero data retention. Your organization must have ZDR enabled.'
        timeoutOpts:
          $ref: '#/components/schemas/ScrapeTimeout'
          default:
            milliseconds: 90000
            behavior: fail
          description: Deadline for the whole request. Defaults to 90000 ms with `fail`. Fixed waits must end before it.
        tags:
          $ref: '#/components/schemas/RequestTags'
          description: Labels for tracking request usage. Not retained when zdr is enabled.
      required:
      - url
      - formats
      allOf:
      - if:
          required:
          - markdownParams
        then:
          properties:
            formats:
              required:
              - markdown
              properties:
                markdown:
                  const: true
      - if:
          required:
          - screenshotParams
        then:
          properties:
            formats:
              required:
              - screenshot
              properties:
                screenshot:
                  const: true
      - if:
          required:
          - imageParams
        then:
          properties:
            formats:
              required:
              - images
              properties:
                images:
                  const: true
      - if:
          required:
          - parseParams
        then:
          properties:
            formats:
              required:
              - parse
              properties:
                parse:
                  const: true
      - if:
          properties:
            formats:
              required:
              - parse
              properties:
                parse:
                  const: true
        then:
          required:
          - parseParams
      - if:
          required:
          - highlightsParams
        then:
          properties:
            formats:
              required:
              - highlights
              properties:
                highlights:
                  const: true
      - if:
          properties:
            formats:
              required:
              - highlights
              properties:
                highlights:
                  const: true
        then:
          required:
          - highlightsParams
      - if:
          required:
          - jsonParams
        then:
          properties:
            formats:
              required:
              - json
              properties:
                json:
                  const: true
      - if:
          properties:
            formats:
              required:
              - json
              properties:
                json:
                  const: true
        then:
          required:
          - jsonParams
      - if:
          required:
          - productParams
        then:
          properties:
            formats:
              required:
              - product
              properties:
                product:
                  const: true
    ScrapeFormats:
      type: object
      additionalProperties: false
      properties:
        html:
          type: boolean
          default: false
          description: Rendered HTML.
        markdown:
          type: boolean
          default: false
          description: Page content as Markdown.
        screenshot:
          type: boolean
          default: false
          description: A screenshot of the page.
        images:
          type: boolean
          default: false
          description: Images found on the page.
        bytes:
          type: boolean
          default: false
          description: The original HTTP response body.
        parse:
          type: boolean
          default: false
          description: Fields extracted with custom rules or a prebuilt parser, returned as `parsed`.
        highlights:
          type: boolean
          default: false
          description: Markdown excerpts relevant to `highlightsParams.query`.
        json:
          type: boolean
          default: false
          description: An object matching `jsonParams.schema`, extracted from the page.
        product:
          type: boolean
          default: false
          description: Product details such as name, price, and availability.
      not:
        allOf:
        - not:
            required:
            - html
            properties:
              html:
                const: true
        - not:
            required:
            - markdown
            properties:
              markdown:
                const: true
        - not:
            required:
            - screenshot
            properties:
              screenshot:
                const: true
        - not:
            required:
            - images
            properties:
              images:
                const: true
        - not:
            required:
            - bytes
            properties:
              bytes:
                const: true
        - not:
            required:
            - parse
            properties:
              parse:
                const: true
        - not:
            required:
            - highlights
            properties:
              highlights:
                const: true
        - not:
            required:
            - json
            properties:
              json:
                const: true
        - not:
            required:
            - product
            properties:
              product:
                const: true
    ScrapeMarkdownParams:
      type: object
      additionalProperties: false
      properties:
        includeLinks:
          type: boolean
          default: true
          description: Keep link URLs in the Markdown. Set false to return link text without URLs.
        includeImages:
          type: boolean
          default: false
          description: Include images in the Markdown using image syntax with URLs and alt text.
        inlineImages:
          type: string
          enum:
          - placeholder
          - preserve
          description: 'How base64 images appear: `placeholder` (default) or `preserve`. Requires `includeImages`.'
      allOf:
      - if:
          required:
          - inlineImages
        then:
          required:
          - includeImages
          properties:
            includeImages:
              const: true
    ScrapeImage:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          pattern: ^(https?://|data:image/)
          description: Image URL, or a data URI for inline images.
        alt:
          type:
          - string
          - 'null'
          description: Alt text, if present.
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        classification:
          type: string
          enum:
          - photography
          - illustration
          - logo
          - wordmark
          - icon
          - pattern
          - graphic
          - other
        fileUrl:
          type: string
          format: uri
          pattern: ^https?://
          description: Hosted image URL, valid for 24 hours after capture. Requires `file` enrichment and ZDR disabled.
      required:
      - url
      - alt
    ScrapeSharedParams:
      type: object
      additionalProperties: false
      properties:
        profile:
          $ref: '#/components/schemas/ScrapeProfile'
          description: Create or reuse an authenticated browser profile. Requires a paid plan and an HTTPS target. Profiles persist session state, bypass shared caches, and cannot be combined with ZDR, custom headers, raw bytes, Google Maps, app store, Instagram, or G2 parsers. The emails, phone-numbers, and links parsers support profiles.
        country:
          type: string
          pattern: ^[A-Za-z]{2}$
          examples:
          - US
          description: Proxy country as a two-letter code, such as `US`. Case-insensitive.
        headers:
          type: object
          propertyNames:
            pattern: ^[!#$%&'*+.^_`|~0-9A-Za-z-]+$
            not:
              pattern: ^(?:[Hh][Oo][Ss][Tt]|[Cc][Oo][Nn][Tt][Ee][Nn][Tt]-[Ll][Ee][Nn][Gg][Tt][Hh]|[Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn]|[Kk][Ee][Ee][Pp]-[Aa][Ll][Ii][Vv][Ee]|[Pp][Rr][Oo][Xx][Yy]-[Aa][Uu][Tt][Hh][Ee][Nn][Tt][Ii][Cc][Aa][Tt][Ee]|[Pp][Rr][Oo][Xx][Yy]-[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn]|[Pp][Rr][Oo][Xx][Yy]-[Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn]|[Tt][Ee]|[Tt][Rr][Aa][Ii][Ll][Ee][Rr]|[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]-[Ee][Nn][Cc][Oo][Dd][Ii][Nn][Gg]|[Uu][Pp][Gg][Rr][Aa][Dd][Ee]|[Ee][Xx][Pp][Ee][Cc][Tt])$
          additionalProperties:
            type: string
            maxLength: 8192
            pattern: ^[^\r\n]*$
          description: HTTP headers to send to the target site. Requests with headers skip the cache.
          examples:
          - Accept-Language: en-US
        viewport:
          type: object
          additionalProperties: false
          properties:
            width:
              type: integer
              description: Browser viewport width in pixels.
              minimum: 240
              maximum: 7680
              default: 1440
            height:
              type: integer
              description: Browser viewport height in pixels.
              minimum: 240
              maximum: 4320
              default: 900
          description: Browser size in pixels. Omit for 1920 × 1080. When provided, missing dimensions default to 1440 × 900.
        theme:
          type: string
          enum:
          - light
          - dark
          description: Emulate a light or dark color scheme.
        dismissCookies:
          type: boolean
          default: true
          description: Accept cookie banners before actions and capture.
        dismissPopups:
          type: boolean
          default: false
          description: Close other popups before actions and capture.
        actions:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/ScrapeAction'
          description: Browser steps run in order before capture. Requires a paid plan. Skips the cache.
        waitFor:
          oneOf:
          - type: integer
            minimum: 0
            maximum: 30000
            title: Milliseconds
          - type: string
            pattern: \S
            maxLength: 2048
            title: CSS selector
          examples:
          - 500
          - '#content'
          description: Milliseconds, or a CSS selector to wait for, after actions. Defaults to 500 (2000 with frames or XML).
        settleAnimations:
          type: boolean
          description: Wait for CSS animations to finish before capture. Defaults to `true` when `screenshot` is requested.
        mainContentOnly:
          type: boolean
          default: false
          description: Keep only the main content. Doesn't affect `screenshot`, `bytes`, or `product`.
        includeSelectors:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            pattern: \S
            maxLength: 2048
          description: Keep only elements matching these CSS selectors.
        excludeSelectors:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            pattern: \S
            maxLength: 2048
          description: Remove elements matching these CSS selectors. Overrides `includeSelectors`.
        includeFrames:
          type: boolean
          default: false
          description: Include iframe content in HTML and text outputs. Screenshots always show visible frames.
