openapi: 3.2.0
info:
  title: Context.dev Web Scraping API
  description: Scrape, crawl, search, and monitor websites, and retrieve brand, people, and news data.
  version: 1.0.0
servers:
- url: https://api.context.dev/v1
tags:
- name: Web Scraping
paths:
  /web/scrape:
    post:
      operationId: scrapeWeb
      summary: Scrape Anything
      description: Scrape anything from a URL on the internet. Returns the outputs you enable in formats. Handles PDFs, DOCX, PPT, XLSX, and 40 other file formats.
      tags:
      - Web Scraping
      security:
      - bearerAuth: []
      x-mint:
        content: <Badge color="blue">From 1 credit</Badge>
        metadata:
          mode: wide
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrapeRequest'
            examples:
              Default:
                summary: Markdown
                value:
                  url: https://example.com
                  formats:
                    markdown: true
              Screenshot:
                summary: Take a screenshot
                value:
                  url: https://example.com
                  formats:
                    screenshot: true
              Highlights:
                summary: Extract passages that answer a question
                value:
                  url: https://en.wikipedia.org/wiki/IEEE_Frank_Rosenblatt_Award
                  formats:
                    highlights: true
                  highlightsParams:
                    query: Who received the IEEE Frank Rosenblatt Award in 2010?
              Parse fields:
                summary: Parse fields
                value:
                  url: https://example.com
                  formats:
                    parse: true
                  parseParams:
                    rules:
                      title: h1
              All outputs:
                summary: Every output except JSON
                value:
                  url: https://example.com
                  formats:
                    html: true
                    markdown: true
                    screenshot: true
                    images: true
                    bytes: true
                    parse: true
                    highlights: true
                    product: true
                  parseParams:
                    rules:
                      title: h1
                  highlightsParams:
                    query: What is this page about?
              With options:
                summary: Shared settings, specific params, and request controls
                value:
                  url: https://example.com
                  formats:
                    markdown: true
                    screenshot: true
                    images: true
                  sharedParams:
                    theme: dark
                    waitFor: main
                    mainContentOnly: true
                    excludeSelectors:
                    - nav
                    - footer
                  markdownParams:
                    includeLinks: false
                  screenshotParams:
                    area: fullPage
                  imageParams:
                    enrich:
                    - dimensions
                  maxAgeMs: 0
                  timeoutOpts:
                    milliseconds: 60000
                    behavior: fail
                  tags:
                  - product-sync
              Shared inputs:
                summary: Country, headers, waiting, and freshness
                value:
                  url: https://example.com
                  formats:
                    screenshot: true
                    images: true
                    bytes: true
                  sharedParams:
                    country: US
                    headers:
                      Accept-Language: en-US
                    waitFor: 500
                  maxAgeMs: 0
              JSON extraction:
                summary: Extract JSON with a schema
                value:
                  url: https://example.com
                  formats:
                    json: true
                  jsonParams:
                    schema:
                      type: object
                      properties:
                        title:
                          type: string
                          description: Main heading.
                        isPlaceholder:
                          type: boolean
                          description: Whether the page is a placeholder domain.
                      required:
                      - title
                      - isPlaceholder
                      additionalProperties: false
                    instructions: Use the first heading as the title.
              Product:
                summary: Extract a product
                value:
                  url: https://example.com/products/travel-mug
                  formats:
                    product: true
                  productParams:
                    dedupeImages: true
      responses:
        '200':
          description: Every output key is present; check each output's `success`. Failed outputs include `error_code` and `message`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
