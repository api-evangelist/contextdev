                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, or disabled API key. Legacy deployments may return 401 USAGE_EXCEEDED for credit exhaustion.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
