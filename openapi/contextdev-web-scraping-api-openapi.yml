  /web/crawl:
    post:
      summary: Crawl a website
      description: Crawl a website and return page content as Markdown. Use a batch for crawls beyond 500 pages.
      security:
      - bearerAuth: []
      tags:
      - Web Scraping
      x-mint:
        content: '<Badge color="blue">1 credit per page</Badge> <Badge color="orange">Rate limit weight: 10</Badge>'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  minLength: 1
                  format: uri
                  description: Start URL, including `http://` or `https://`.
                maxPages:
                  type: integer
                  minimum: 1
                  maximum: 500
                  default: 100
                  description: Maximum pages to crawl.
                maxDepth:
                  type: integer
                  minimum: 0
                  description: Maximum link depth from the starting URL (0 = only the starting page)
                urlRegex:
                  type: string
                  maxLength: 256
                  description: Regex pattern. Only URLs matching this pattern will be followed and scraped. An automatic prefix scope in the form ^<starting URL> follows a redirect of the starting page.
                  example: ^https?://[^/]+/blog/
                excludeUrlRegex:
                  type: string
                  maxLength: 256
                  description: RE2 regex pattern. URLs matching this pattern are never followed or scraped, even when they match urlRegex. The starting URL is always scraped.
                  example: /tag/|/author/
                includeLinks:
                  type: boolean
                  default: true
                  description: Preserve hyperlinks in the Markdown output
                includeImages:
                  type: boolean
                  default: false
                  description: Include image references in the Markdown output
                shortenBase64Images:
                  type: boolean
                  default: true
                  description: Truncate base64-encoded image data in the Markdown output
                useMainContentOnly:
                  type: boolean
                  default: false
                  description: Extract only the main content, stripping headers, footers, sidebars, and navigation
                followSubdomains:
                  type: boolean
                  default: false
                  description: When true, follow links on subdomains of the starting URL's domain (e.g. docs.example.com when starting from example.com). www and apex are always treated as equivalent.
                pdf:
                  type: object
                  properties:
                    shouldParse:
                      type: boolean
                      default: true
                      description: When true, PDF pages are fetched and parsed. When false, PDF pages are skipped entirely (not included in results and not counted as failures).
                    start:
                      type: integer
                      minimum: 1
                      description: First 1-based PDF page to parse.
                    end:
                      type: integer
                      minimum: 1
                      description: Last PDF page to parse (1-based, inclusive). Defaults to the final page. Must be >= start.
                    ocr:
                      type: boolean
                      default: false
                      description: Read scanned PDF pages with OCR; preserve pages that already have text.
                  default:
                    shouldParse: true
                    ocr: false
                  additionalProperties: false
                  description: PDF handling. `start`/`end` limit parsing to an inclusive, 1-based page range.
                includeFrames:
                  type: boolean
                  default: false
                  description: When true, the contents of iframes are rendered to Markdown for each crawled page.
                includeSelectors:
                  type:
                  - array
                  - 'null'
                  items:
                    type: string
                    minLength: 1
                    maxLength: 2048
                  maxItems: 50
                  description: Keep matching HTML subtrees before converting each page to Markdown.
                excludeSelectors:
                  type:
                  - array
                  - 'null'
                  items:
                    type: string
                    minLength: 1
                    maxLength: 2048
                  maxItems: 50
                  description: Remove matching elements after inclusions. Exclusions take precedence.
                maxAgeMs:
                  type:
                  - integer
                  - 'null'
                  minimum: 0
                  maximum: 2592000000
                  default: 86400000
                  description: Maximum cache age in milliseconds. Defaults to 1 day; `0` fetches fresh.
                waitForMs:
                  type:
                  - integer
                  - 'null'
                  minimum: 0
                  maximum: 30000
                  default: 3500
                  description: 'Browser wait time in milliseconds after initial page load for each crawled page. Defaults to 3500 (3.5 seconds). Min: 0. Max: 30000 (30 seconds).'
                settleAnimations:
                  type: boolean
                  default: false
                  description: Wait briefly for CSS animations and transitions to settle before reading each page.
                stopAfterMs:
                  type: integer
                  minimum: 10000
                  default: 80000
                  maximum: 110000
                  description: Soft crawl deadline in milliseconds. Returns pages collected before the next deadline check.
                timeoutOpts:
                  $ref: '#/components/schemas/PartialTimeout'
                country:
                  $ref: '#/components/schemas/BrowserCountryCode'
                zdr:
                  type: string
                  enum:
                  - enabled
                  - disabled
                  default: disabled
                  description: '`enabled` turns on zero data retention. Returns 403 `ZDR_NOT_ENABLED` unless your organization has ZDR.'
                tags:
                  $ref: '#/components/schemas/RequestTags'
              required:
              - url
            example:
              url: https://example.com
              maxPages: 10
      responses:
        '200':
          description: Successful response
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
            X-Context-ZDR:
              description: Present with the value true when zero data retention was requested and honored.
              schema:
                type: string
                enum:
                - 'true'
          content:
            application/json:
              schema:
                type: object
                properties:
                  partial:
                    type: boolean
                    description: True when timeoutOpts.behavior=return-partial returned the usable results collected before the deadline. Partial collections are not cached as complete results.
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        markdown:
                          type: string
                          description: Extracted page content as Markdown (empty string on failure)
                        metadata:
                          allOf:
                          - $ref: '#/components/schemas/PageMetadata'
                          - type: object
                            properties:
                              url:
                                type: string
                                description: The crawl URL fetched for this page.
                              title:
                                type: string
                                description: Best page title extracted from the page (empty string if unavailable).
                              crawlDepth:
                                type: integer
                                description: Depth relative to the start URL. 0 = start URL, 1 = one link away.
                              statusCode:
                                type: integer
                                description: HTTP status code of the response
                              success:
                                type: boolean
                                description: true if the page was fetched and parsed successfully
                            required:
                            - url
                            - title
                            - crawlDepth
                            - statusCode
                            - success
                      required:
                      - markdown
                      - metadata
                  metadata:
                    type: object
                    properties:
                      numUrls:
                        type: integer
                        description: Total number of URLs crawled
                      maxCrawlDepth:
                        type: integer
                        description: Maximum crawl depth reached during the crawl
                      numSucceeded:
                        type: integer
                        description: Number of pages successfully crawled
                      numFailed:
                        type: integer
                        description: Number of pages that failed to crawl
                      numSkipped:
                        type: integer
                        description: Number of URLs skipped (PDFs when pdf.shouldParse=false, URLs not matching urlRegex, or URLs matching excludeUrlRegex)
                    required:
                    - numUrls
                    - maxCrawlDepth
                    - numSucceeded
                    - numFailed
                    - numSkipped
                  key_metadata:
                    $ref: '#/components/schemas/KeyMetadata'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
                  cache_metadata:
                    $ref: '#/components/schemas/CacheMetadata'
                required:
                - results
                - metadata
                - request_id
                - cache_metadata
        '400':
          description: Bad request - Invalid URL or parameters
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message describing the issue
                  error_code:
                    type: string
                    enum:
                    - INPUT_VALIDATION_ERROR
                    - WEBSITE_ACCESS_ERROR
                    description: Machine-readable error code.
                  key_metadata:
                    $ref: '#/components/schemas/KeyMetadata'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
                required:
                - message
                - error_code
                - request_id
        '401':
          description: Missing, invalid, or disabled API key.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Insufficient credits (`USAGE_EXCEEDED`); authentication is valid. Retry once funded. Legacy deployments may return 401.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: API key permissions or organization settings do not allow this request.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Mode:
              $ref: '#/components/headers/RateLimitMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
