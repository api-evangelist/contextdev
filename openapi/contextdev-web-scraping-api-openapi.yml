          type: object
          additionalProperties: false
          description: Document parsing options.
          properties:
            pdf:
              $ref: '#/components/schemas/ScrapePdfOptions'
              description: PDF page range and OCR.
    ScrapeJsonParams:
      type: object
      additionalProperties: false
      properties:
        schema:
          type: object
          additionalProperties: true
          description: JSON Schema (not an example object) for a top-level object, up to 50 KB. Use optional or nullable fields for missing facts.
          example:
            type: object
            properties:
              name:
                type: string
                description: Product name.
              price:
                type: number
                description: Current price as a plain number.
              inStock:
                type: boolean
            required:
            - name
            additionalProperties: false
        instructions:
          type: string
          maxLength: 2000
          description: Extra guidance, such as which facts to prefer or how to read a field.
      required:
      - schema
    PartialTimeout:
      type: object
      properties:
        milliseconds:
          type: integer
          minimum: 1000
          maximum: 300000
          description: Deadline in milliseconds.
        behavior:
          type: string
          enum:
          - fail
          - return-partial
          default: fail
          description: '"fail" returns 408 at the deadline. "return-partial" returns available results; inspect the response’s partial flag.'
      required:
      - milliseconds
      additionalProperties: false
      description: Request deadline and what to return when it passes.
    ScrapeParseParams:
      oneOf:
      - type: object
        title: Custom parser
        additionalProperties: false
        properties:
          type:
            type: string
            const: custom
            default: custom
            description: Extract fields using custom CSS rules. This is the default when type is omitted.
          rules:
            $ref: '#/components/schemas/ScrapeParseRules'
        required:
        - rules
      - type: object
        title: Prebuilt parser
        additionalProperties: false
        properties:
          type:
            type: string
            const: prebuilt
            description: Use a prebuilt parser instead of custom rules.
          parser:
            type: string
            enum:
            - google-maps
            - google-maps-reviews
            - google-play
            - google-play-reviews
            - app-store
            - app-store-reviews
            - g2-reviews
            - instagram-profile
            - instagram-post
            - instagram-feed
            - tiktok-profile
            - tiktok-video
            - tiktok-feed
            - tiktok-comments
            - tiktok-followers
            - tiktok-following
            - tiktok-user-search
            - emails
            - phone-numbers
            - links
            description: The prebuilt parser to use. See https://docs.context.dev/scrape/prebuilt-parsers for supported sources, request options, and output schemas.
          sort:
            type: string
            enum:
            - newest
            - oldest
            - relevant
            - highest
            - lowest
            default: newest
            description: google-maps-reviews only. Order of data.reviews. newest, relevant, highest, and lowest follow Google; oldest returns the earliest reviews first, which Google itself does not offer.
          limit:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
            description: google-maps-reviews only. Maximum number of reviews to return. Defaults to 100; maximum 1000.
        required:
        - type
        - parser
    ScrapeParseRules:
      type: object
      additionalProperties:
        anyOf:
        - type: string
          minLength: 1
          maxLength: 2048
        - type: object
          properties:
            selector:
              type: string
              minLength: 1
              maxLength: 2048
              description: CSS selector to match within the current page or parent rule.
            type:
              type: string
              enum:
              - item
              - list
              description: Return the first match with `item` or all matches with `list`.
            output:
              description: Return text, HTML, an attribute such as `@href`, or nested field rules. Defaults to text.
              anyOf:
              - type: string
                enum:
                - text
                - html
              - type: string
                pattern: ^@.*$
              - $ref: '#/components/schemas/ScrapeParseRules'
          required:
          - selector
          additionalProperties: false
      minProperties: 1
      description: Field names mapped to CSS selectors (`h1`, `a@href`) or rule objects. Max 100 fields, 5 levels.
