          type: string
          enum:
            - run.completed
        id:
          type: string
          example: evt_123
        created_at:
          type: string
          format: date-time
          example: '2026-07-09T18:00:12.000Z'
        data:
          type: object
          properties:
            run:
              type: object
              properties:
                id:
                  type: string
                  example: run_123
                monitor_id:
                  type: string
                  example: mon_123
                status:
                  type: string
                  enum:
                    - completed
                run_type:
                  type: string
                  enum:
                    - baseline
                    - scheduled
                  description: The first run after monitor creation is a baseline run.
