webhooks:
  monitorChangeDetected:
    post:
      summary: Monitor change detected
      description: >-
        Sent to a monitor's configured webhook URL when a run detects a change.
        Return any 2xx response to acknowledge the delivery.
      operationId: monitorChangeDetected
      tags:
        - Monitors
      security: []
      parameters:
        - name: User-Agent
          in: header
          required: true
          description: Identifies the Context.dev webhook sender.
          schema:
            type: string
            example: Context.dev-Webhooks/1.0
        - name: X-Context-Event
          in: header
          required: true
          description: Event type for this delivery.
          schema:
            type: string
            enum:
              - change.detected
        - name: X-Context-Id
          in: header
          required: true
          description: >-
            Unique event ID. Matches the top-level `id` field in the request
            body.
          schema:
            type: string
            example: evt_123
        - name: X-Context-Signature
          in: header
          description: >-
            HMAC signature in the form `t=<unix>,v1=<hmac>`. The HMAC is SHA-256
            over `"{t}.{rawRequestBody}"`, keyed with the monitor webhook
            secret. Verify the unmodified request body with a constant-time
            comparison and reject stale timestamps.
          schema:
            type: string
            example: >-
              t=1783620012,v1=087d98aada1e39f9d24d65951f51e672da12b2f9ea1c02c7c8c5ef254f5d4068
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorsChangeDetectedWebhookPayload'
      responses:
        2XX:
          description: Webhook accepted.
  monitorRunCompleted:
    post:
      summary: Monitor run completed
      description: >-
        Sent to a monitor's configured webhook URL after every completed run
        when the webhook subscribes to the run.completed event — including runs
        that detected no change, as confirmation the monitor ran. When a change
        was detected it is embedded in the payload. Return any 2xx response to
        acknowledge the delivery.
      operationId: monitorRunCompleted
      tags:
        - Monitors
      security: []
      parameters:
        - name: User-Agent
          in: header
          required: true
          description: Identifies the Context.dev webhook sender.
          schema:
            type: string
            example: Context.dev-Webhooks/1.0
        - name: X-Context-Event
          in: header
          required: true
          description: Event type for this delivery.
          schema:
            type: string
            enum:
              - run.completed
        - name: X-Context-Id
          in: header
          required: true
          description: >-
            Unique event ID. Matches the top-level `id` field in the request
            body.
          schema:
            type: string
            example: evt_123
        - name: X-Context-Signature
          in: header
          description: >-
            HMAC signature in the form `t=<unix>,v1=<hmac>`. The HMAC is SHA-256
            over `"{t}.{rawRequestBody}"`, keyed with the monitor webhook
            secret. Verify the unmodified request body with a constant-time
            comparison and reject stale timestamps.
          schema:
            type: string
            example: >-
              t=1783620012,v1=087d98aada1e39f9d24d65951f51e672da12b2f9ea1c02c7c8c5ef254f5d4068
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorsRunCompletedWebhookPayload'
      responses:
        2XX:
          description: Webhook accepted.
