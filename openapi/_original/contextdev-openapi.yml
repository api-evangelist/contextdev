paths:
  /parse:
    post:
      summary: Parse Bytes
      description: >-
        Converts raw text, source code, web/data, PDF, Microsoft Office, and
        image bytes into LLM-usable Markdown.
      requestBody:
        required: true
        description: Raw file bytes. The request body must not exceed 25 MiB.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          application/pdf:
            schema:
              type: string
              format: binary
          '*/*':
            schema:
              type: string
              format: binary
      security:
        - bearerAuth: []
      tags:
        - Parsing
      x-mint:
        content: <Badge color="blue">1 Credit</Badge>
        title: Parse Bytes
        sidebarTitle: Parse Bytes
        description: Convert raw document bytes into Markdown
      parameters:
        - schema:
            type: string
            enum:
              - txt
              - text
              - md
              - markdown
              - html
              - htm
              - xhtml
              - xml
              - rss
              - atom
              - csv
              - tsv
              - yaml
              - yml
              - py
              - java
              - js
              - jsx
              - mjs
              - cjs
              - json
              - jsonl
              - ndjson
              - php
              - sh
              - bash
              - zsh
              - fish
              - rb
              - ts
              - tsx
              - rtf
              - srt
              - css
              - scss
              - less
              - styl
              - sass
              - svg
              - pdf
              - docx
              - doc
              - xlsx
              - xlsm
              - xlsb
              - xltx
              - xltm
              - xls
              - pptx
              - pptm
              - ppsx
              - ppsm
              - potx
              - potm
              - ppt
              - pps
              - pot
              - jpg
              - jpeg
              - jpe
              - png
              - gif
              - bmp
              - tiff
              - tif
              - webp
              - ppm
              - pbm
              - pgm
              - pnm
            description: >-
              Optional file extension hint, such as pdf, docx, xlsx, pptx, html,
              json, csv, md, py, rtf, jpg, png, or txt.
          required: false
          description: >-
            Optional file extension hint, such as pdf, docx, xlsx, pptx, html,
            json, csv, md, py, rtf, jpg, png, or txt.
          name: extension
          in: query
        - schema:
            anyOf:
              - type: boolean
              - type: string
                enum:
                  - 'true'
                  - 'false'
            default: true
            description: Preserve hyperlinks in Markdown output
          required: false
          description: Preserve hyperlinks in Markdown output
          name: includeLinks
          in: query
        - schema:
            anyOf:
              - type: boolean
              - type: string
                enum:
                  - 'true'
                  - 'false'
            default: false
            description: Include image references in Markdown output
          required: false
          description: Include image references in Markdown output
          name: includeImages
          in: query
        - schema:
            anyOf:
              - type: boolean
              - type: string
                enum:
                  - 'true'
                  - 'false'
            default: true
            description: Shorten base64-encoded image data in the Markdown output
          required: false
          description: Shorten base64-encoded image data in the Markdown output
          name: shortenBase64Images
          in: query
        - schema:
            anyOf:
              - type: boolean
              - type: string
                enum:
                  - 'true'
                  - 'false'
            default: false
            description: Extract only the main content from HTML-like inputs
          required: false
          description: Extract only the main content from HTML-like inputs
          name: useMainContentOnly
          in: query
        - schema:
            anyOf:
              - type: boolean
              - type: string
                enum:
                  - 'true'
                  - 'false'
            default: false
            description: >-
              When true for PDF inputs, detect and OCR images embedded in the
              selected pages, inserting recognized text at each image's position
              in page reading order while preserving the PDF text layer.
              pdf.start/pdf.end limit the inclusive page range. When false, all
              OCR is disabled, including the automatic scanned-PDF fallback.
          required: false
          description: >-
            When true for PDF inputs, detect and OCR images embedded in the
            selected pages, inserting recognized text at each image's position
            in page reading order while preserving the PDF text layer.
            pdf.start/pdf.end limit the inclusive page range. When false, all
            OCR is disabled, including the automatic scanned-PDF fallback.
          name: ocr
          in: query
        - schema:
            type: object
            properties:
              start:
                type: integer
                minimum: 1
                description: >-
                  First 1-based PDF page to parse. When omitted, parsing starts
                  at the first page.
              end:
                type: integer
                minimum: 1
                description: >-
                  Last 1-based PDF page to parse. When omitted, parsing ends at
                  the last page. Must be greater than or equal to start when
                  both are provided.
            default: {}
            additionalProperties: false
            description: >-
              PDF page-range options as a JSON object, e.g. {"start": 2, "end":
              5}.
          required: false
          description: >-
            PDF page-range options as a JSON object, e.g. {"start": 2, "end":
            5}.
          name: pdf
          in: query
        - schema:
            type: string
            minLength: 1
            maxLength: 100
            description: Optional client identifier used for usage attribution.
          required: false
          description: Optional client identifier used for usage attribution.
          name: client
          in: query
        - $ref: '#/components/parameters/RequestTags'
      responses:
        '200':
          description: Successful response
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                    description: Indicates success
                  markdown:
                    type: string
                    description: Input bytes converted to GitHub Flavored Markdown
                  type:
                    type: string
                    enum:
                      - html
                      - xml
                      - json
                      - jsonl
                      - text
                      - csv
                      - tsv
                      - markdown
                      - yaml
                      - python
                      - java
                      - javascript
                      - php
                      - shell
                      - ruby
                      - typescript
                      - rtf
                      - srt
                      - css
                      - scss
                      - less
                      - stylus
                      - sass
                      - svg
                      - pdf
                      - docx
                      - doc
                      - xlsx
                      - xls
                      - pptx
                      - ppt
                      - jpg
                      - png
                      - gif
                      - bmp
                      - tiff
                      - webp
                      - ppm
                      - pbm
                      - pgm
                      - pnm
                    description: Detected content type used for parsing
                  key_metadata:
                    $ref: '#/components/schemas/KeyMetadata'
                required:
                  - success
                  - markdown
                  - type
        '400':
          description: Invalid input or no parseable content
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error_code:
                    type: string
                    enum:
                      - INPUT_VALIDATION_ERROR
                      - WEBSITE_ACCESS_ERROR
                  key_metadata:
                    $ref: '#/components/schemas/KeyMetadata'
        '413':
          description: Request body exceeds the 25 MiB upload limit
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error_code:
                    type: string
                    enum:
                      - INPUT_VALIDATION_ERROR
        '415':
          description: Unsupported content type
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error_code:
                    type: string
                    enum:
                      - UNSUPPORTED_CONTENT
                  key_metadata:
                    $ref: '#/components/schemas/KeyMetadata'
        '500':
          description: Internal server error
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error_code:
                    type: string
                    enum:
                      - INTERNAL_ERROR
                  key_metadata:
                    $ref: '#/components/schemas/KeyMetadata'
      x-codeSamples:
        - lang: JavaScript
          source: >-
            import ContextDev from 'context.dev';


            const client = new ContextDev({
              apiKey: process.env['CONTEXT_DEV_API_KEY'], // This is the default and can be omitted
            });


            const response = await
            client.parse.handle(fs.createReadStream('path/to/file'));


            console.log(response.markdown);
        - lang: Python
          source: |-
            import os
            from context.dev import ContextDev

            client = ContextDev(
                api_key=os.environ.get("CONTEXT_DEV_API_KEY"),  # This is the default and can be omitted
            )
            response = client.parse.handle(
                body=b"Example data",
            )
            print(response.markdown)
        - lang: Go
          source: "package main\n\nimport (\n\t\"bytes\"\n\t\"context\"\n\t\"fmt\"\n\t\"io\"\n\n\t\"github.com/context-dot-dev/context-go-sdk\"\n\t\"github.com/context-dot-dev/context-go-sdk/option\"\n)\n\nfunc main() {\n\tclient := contextdev.NewClient(\n\t\toption.WithAPIKey(\"My API Key\"),\n\t)\n\tresponse, err := client.Parse.Handle(\n\t\tcontext.TODO(),\n\t\tio.Reader(bytes.NewBuffer([]byte(\"Example data\"))),\n\t\tcontextdev.ParseHandleParams{},\n\t)\n\tif err != nil {\n\t\tpanic(err.Error())\n\t}\n\tfmt.Printf(\"%+v\\n\", response.Markdown)\n}\n"
        - lang: Ruby
          source: >-
            require "context_dev"


            context_dev = ContextDev::Client.new(api_key: "My API Key")


            response = context_dev.parse.handle(body: StringIO.new("Example
            data"))


            puts(response)
        - lang: PHP
          source: >-
            <?php


            require_once dirname(__DIR__) . '/vendor/autoload.php';


            use ContextDev\Client;

            use ContextDev\Core\FileParam;

            use ContextDev\Core\Exceptions\APIException;


            $client = new Client(apiKey: getenv('CONTEXT_DEV_API_KEY') ?: 'My
            API Key');


            try {
              $response = $client->parse->handle(
                FileParam::fromString('Example data', filename: uniqid('file-upload-', true)),
              );

              var_dump($response);
            } catch (APIException $e) {
              echo $e->getMessage();
            }
        - lang: CLI
          source: |-
            context-dev parse handle \
              --api-key 'My API Key' \
              --body 'Example data'
  /web/scrape/html:
    get:
      summary: Scrape HTML
      description: Scrapes the given URL and returns the raw HTML content of the page.
      security:
        - bearerAuth: []
      tags:
        - Web Scraping
      x-mint:
        content: <Badge color="blue">1 Credit</Badge>
        title: Scrape HTML
        sidebarTitle: Scrape HTML
        description: Scrape the raw HTML from a URL
      parameters:
        - schema:
            type: string
            minLength: 1
            format: uri
            description: Full URL to scrape (must include http:// or https:// protocol)
          required: true
          description: Full URL to scrape (must include http:// or https:// protocol)
          name: url
          in: query
        - schema:
            type: object
            properties:
              shouldParse:
                anyOf:
                  - type: boolean
                  - type: string
                    enum:
                      - 'true'
                      - 'false'
                default: true
                description: >-
                  When true, PDF URLs are fetched and parsed. When false, PDF
                  URLs are skipped and a 400 WEBSITE_ACCESS_ERROR is returned.
              start:
                type: integer
                minimum: 1
                description: >-
                  First 1-based PDF page to parse. When omitted, parsing starts
                  at the first page.
              end:
                type: integer
                minimum: 1
                description: >-
                  Last 1-based PDF page to parse. When omitted, parsing ends at
                  the last page. Must be greater than or equal to start when
                  both are provided.
              ocr:
                anyOf:
                  - type: boolean
                  - type: string
                    enum:
                      - 'true'
                      - 'false'
                default: false
                description: >-
                  When true, detect and OCR images embedded in the selected PDF
                  pages, inserting recognized text at each image's position in
                  page reading order while preserving the PDF text layer. This
                  is separate from automatic scanned-PDF OCR fallback.
            default:
              shouldParse: true
              ocr: false
            description: >-
              PDF parsing controls. Use start/end to limit text extraction and
              embedded-image detection/OCR to an inclusive 1-based page range.
          required: false
          description: >-
            PDF parsing controls. Use start/end to limit text extraction and
            embedded-image detection/OCR to an inclusive 1-based page range.
          name: pdf
          in: query
        - schema:
            anyOf:
              - type: boolean
              - type: string
                enum:
                  - 'true'
                  - 'false'
            default: false
            description: When true, iframes are rendered inline into the returned HTML.
          required: false
          description: When true, iframes are rendered inline into the returned HTML.
          name: includeFrames
          in: query
