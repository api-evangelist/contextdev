          required:
            - run
            - change
          additionalProperties: false
      required:
        - event
        - id
        - created_at
        - data
      additionalProperties: false
      title: Monitor run completed webhook payload
      description: >-
        Payload sent after every completed run when the monitor's webhook
        subscribes to run.completed. A run with `change_detected: false` is a
