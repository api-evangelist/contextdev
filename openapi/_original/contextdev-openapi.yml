                  $ref: '#/components/schemas/MonitorsTargetType'
                change_detection_type:
                  $ref: '#/components/schemas/MonitorsChangeDetectionType'
                started_at:
                  type: string
                  format: date-time
                completed_at:
                  type: string
                  format: date-time
                change_detected:
                  type: boolean
                  example: false
                change_id:
                  type:
                    - string
                    - 'null'
                  example: null
                baseline_created:
                  type: boolean
                  description: >-
                    True when this run established the monitor's initial
                    baseline; baseline runs perform no change detection.
              required:
                - id
                - monitor_id
                - status
                - run_type
                - target_type
                - change_detection_type
                - started_at
