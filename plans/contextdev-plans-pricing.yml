  product terms (pages scraped, brands retrieved, logos pulled). The pricing page
  and the rate-limit reference in the docs do NOT agree on plan names or on two
  of the numbers — the docs table lists Free / Hobby / Starter / Pro / Scale /
  Enterprise while the pricing page lists Free / Developer / Pro / Scale /
  Enterprise, and the docs give Scale 2,500,000 credits at 800 req/min where the
  pricing page gives Scale 1,000,000 credits at 700 req/min. Both readings are
  recorded here verbatim rather than reconciled; see the `discrepancies` block.
