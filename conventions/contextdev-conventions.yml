generated: '2026-08-14'
method: searched
source: >-
  https://docs.context.dev (optimization/best-practices, rate-limits,
  troubleshooting, tag-requests, compression),
  https://docs.context.dev/api-reference/batches/submit.md + derived from
  openapi/contextdev-openapi.yml and openapi/contextdev-batch-api-openapi.yml
authentication:
  style: bearer
  header: Authorization
  scheme: Bearer
  key_prefix: ctxt_secret_
  docs: https://www.context.dev/auth.md
  cross_ref: authentication/contextdev-authentication.yml
idempotency:
  supported: true
  header: Idempotency-Key
  transport: request header
  max_length: 200
  required: false
  scope: POST /batch/submit (submitBatch)
  semantics: >-
    Any string unique to this submission. A retry carrying the same key returns
    the ORIGINAL batch rather than creating a second one.
  conflict:
    status: 409
    error_code: IDEMPOTENCY_KEY_CONFLICT
    meaning: The same Idempotency-Key was reused with a different request body.
  retention: not documented
  sdk_support: >-
    Exposed as a first-class SDK argument (`idempotencyKey` in the PHP example on
    the submit reference page), so it is not a raw-header-only affordance.
  docs: https://docs.context.dev/api-reference/batches/submit
  source: openapi/contextdev-batch-api-openapi.yml
  corrected: '2026-08-14'
  correction_note: >-
    This field previously read `supported: false`. That was correct for the
    surface captured in July, which had no batch endpoints. The Batch API
    harvested on 2026-08-14 does implement Idempotency-Key with a documented
    409/IDEMPOTENCY_KEY_CONFLICT contract on its one expensive write.
  coverage_caveat: >-
    Idempotency is scoped to batch submission ONLY. Monitor CRUD (createMonitor,
    updateMonitor, deleteMonitor, runMonitorNow) and the cancel/delete batch
    operations accept no idempotency key. Retries elsewhere are still guided by
    rate-limit headers and Retry-After.
pagination:
  style: cursor
  request_params:
  - cursor
  - limit
  response_fields:
  - data
  - next_cursor
  - has_more
  applies_to:
  - listMonitors
  - listMonitorRuns
  - listMonitorChanges
  - listAccountRuns
  - listChanges
rate_limiting:
  scope: per-minute fixed window, per API key
  request_headers: []
  response_headers:
  - X-RateLimit-Limit
  - X-RateLimit-Remaining
  - X-RateLimit-Reset
  retry_after: Retry-After (1-60 seconds on 429)
  status_code: 429
  docs: https://docs.context.dev/optimization/rate-limits.md
  cross_ref: rate-limits/
request_tagging:
  supported: true
  param: tags
  transport: JSON body on POST, comma-separated query param on GET
  limit: up to 20 tags, 1-50 chars each
  effect: usage-tracking only (no behavior/pricing/caching impact); Monitors excluded
  docs: https://docs.context.dev/optimization/tag-requests.md
compression:
  supported: true
  method: gzip (Accept-Encoding)
  docs: https://docs.context.dev/optimization/compression.md
versioning:
  scheme: uri-path
  current: v1
  base_url: https://api.context.dev/v1
error_envelope:
  fields:
  - message
  - status
  - error_code
  note: 429 responses use `code` instead of `error_code`.
  cross_ref: errors/contextdev-problem-types.yml
metadata:
  credits: >-
    Every response reflects credit-based billing; some endpoints document a fixed
    credit cost (e.g. /parse = 1 credit, +5 with OCR).
